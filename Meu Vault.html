<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meu Vault</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--tx:#1d1c1a;--mu:#7a7770;--bd:#e6e3dc;--ac:#5b5bd6;--sh:0 1px 3px rgba(0,0,0,.06),0 6px 20px rgba(0,0,0,.04);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151514;--card:#1f1e1d;--tx:#efede8;--mu:#9a968d;--bd:#2d2b29;--ac:#8b8bf0;--sh:0 1px 3px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#151514;--card:#1f1e1d;--tx:#efede8;--mu:#9a968d;--bd:#2d2b29;--ac:#8b8bf0;--sh:0 1px 3px rgba(0,0,0,.4)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--bd);background:var(--card);border-radius:10px;padding:8px 12px}
button:hover{border-color:var(--ac)}
.pri{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}
.pri:hover{opacity:.9}
input,textarea{width:100%;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:9px 12px;outline:none}
input:focus,textarea:focus{border-color:var(--ac)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:10px;align-items:center;padding:12px 20px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--bd)}
.logo{font-weight:800;font-size:18px;cursor:pointer;white-space:nowrap}
.logo span{color:var(--ac)}
header input{max-width:420px;flex:1}
.sp{flex:1}
main{max-width:1100px;margin:0 auto;padding:24px 20px 90px}
h1{font-size:26px;margin:0 0 4px}
.mu{color:var(--mu)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-top:18px}
.list{display:flex;flex-direction:column;gap:8px;margin-top:18px}
.box{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px;cursor:pointer;box-shadow:var(--sh);transition:transform .15s;position:relative;overflow:hidden}
.box:hover{transform:translateY(-3px)}
.box:before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:var(--c)}
.bi{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:color-mix(in srgb,var(--c) 22%,transparent);margin-bottom:12px}
.box b{display:block;font-size:17px}
.newbox{border:2px dashed var(--bd);background:transparent;display:grid;place-items:center;min-height:150px;color:var(--mu);font-weight:600;text-align:center;box-shadow:none}
.newbox:before{display:none}
.newbox:hover{border-color:var(--ac);color:var(--ac)}
.item{background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden;cursor:pointer;box-shadow:var(--sh);position:relative}
.item.drag{opacity:.4}
.thumb{height:140px;display:grid;place-items:center;font-size:38px;background:color-mix(in srgb,var(--c,#888) 14%,var(--bg));overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.ib{padding:10px 12px}
.ib b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tg{display:inline-block;font-size:12px;background:var(--bg);border:1px solid var(--bd);border-radius:20px;padding:0 8px;margin:4px 4px 0 0;color:var(--mu);cursor:pointer}
.fav{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.35);color:#fff;border:0;border-radius:50%;width:30px;height:30px;padding:0}
.fav.on{color:#ffc933}
.list .item{display:flex;align-items:center}
.list .thumb{width:64px;height:64px;font-size:24px;flex:none}
.list .ib{flex:1;min-width:0}
.list .fav{position:static;margin-right:10px;background:none;color:var(--mu)}
.list .fav.on{color:#e9a900}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.chip{border-radius:20px;padding:5px 12px;font-size:14px}
.chip.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));border-radius:30px;padding:14px 20px;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:6}
.mb{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:20;padding:16px}
.m{background:var(--bg);border:1px solid var(--bd);border-radius:20px;padding:22px;width:100%;max-width:520px;max-height:90vh;overflow:auto}
.m h2{margin:0 0 14px;font-size:20px}
.m label{display:block;font-size:13px;color:var(--mu);margin:12px 0 4px}
.sw{width:30px;height:30px;border-radius:50%;padding:0;background:var(--c);border:3px solid transparent}
.sw.sel{border-color:var(--tx)}
.ic{width:38px;height:38px;padding:0;font-size:19px}
.ic.sel{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 18%,transparent)}
.big{max-width:100%;max-height:340px;border-radius:12px;display:block;margin:0 auto 10px}
.empty{text-align:center;padding:50px 10px;color:var(--mu)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 16px;border-radius:20px;z-index:30}
.hid{display:none}
a{color:var(--ac)}
@media(max-width:600px){header{padding:10px 12px}.logo span{display:none}main{padding:18px 14px 90px}}
/* ===== Liquid glass + bento ===== */
:root{--bg:#ece8f2;--card:rgba(255,255,255,.5);--gl2:rgba(246,243,252,.82);--tx:#1d1b26;--mu:#6f6b80;--bd:rgba(255,255,255,.75);--ac:#6c5ce7;--sh:inset 0 1px 0 rgba(255,255,255,.9),inset 0 -1px 0 rgba(255,255,255,.25),0 12px 32px rgba(90,70,160,.16);--g:radial-gradient(55% 45% at 12% 8%,#cbbcff 0,transparent 70%),radial-gradient(45% 45% at 92% 18%,#a6f0e4 0,transparent 70%),radial-gradient(60% 55% at 78% 98%,#ffcfc0 0,transparent 70%)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12111a;--card:rgba(255,255,255,.07);--gl2:rgba(28,26,40,.88);--tx:#f1eefb;--mu:#a29fb5;--bd:rgba(255,255,255,.14);--ac:#9b8cff;--sh:inset 0 1px 0 rgba(255,255,255,.18),0 12px 32px rgba(0,0,0,.45);--g:radial-gradient(55% 45% at 12% 8%,#4a3a9455 0,transparent 70%),radial-gradient(45% 45% at 92% 18%,#1f857a44 0,transparent 70%),radial-gradient(60% 55% at 78% 98%,#9a4a6a44 0,transparent 70%)}}
:root[data-theme="dark"]{--bg:#12111a;--card:rgba(255,255,255,.07);--gl2:rgba(28,26,40,.88);--tx:#f1eefb;--mu:#a29fb5;--bd:rgba(255,255,255,.14);--ac:#9b8cff;--sh:inset 0 1px 0 rgba(255,255,255,.18),0 12px 32px rgba(0,0,0,.45);--g:radial-gradient(55% 45% at 12% 8%,#4a3a9455 0,transparent 70%),radial-gradient(45% 45% at 92% 18%,#1f857a44 0,transparent 70%),radial-gradient(60% 55% at 78% 98%,#9a4a6a44 0,transparent 70%)}
body{background:var(--g),var(--bg);background-attachment:fixed;min-height:100vh}
h1{letter-spacing:-.02em;font-weight:800}
button,input,textarea,.box,.item,header{backdrop-filter:blur(18px) saturate(170%);-webkit-backdrop-filter:blur(18px) saturate(170%)}
button{border-radius:999px;padding:8px 16px;border-color:var(--bd);box-shadow:var(--sh);transition:transform .15s,border-color .15s}
button:active{transform:scale(.96)}
input,textarea{border-radius:22px;border-color:var(--bd);box-shadow:inset 0 2px 6px rgba(90,70,160,.08)}
header{margin:10px 14px 0;top:calc(env(safe-area-inset-top,0px) + 10px);border:1px solid var(--bd);border-radius:999px;background:var(--card);box-shadow:var(--sh);padding:8px 14px}
header input{border-radius:999px}
.pri{background:linear-gradient(135deg,#9a8cff,#5b5bd6);color:#fff;border-color:rgba(255,255,255,.45);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 10px 24px rgba(108,92,231,.45)}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.box,.item{background:var(--card);border-color:var(--bd);box-shadow:var(--sh)}
.box{border-radius:30px;padding:20px;display:flex;flex-direction:column;justify-content:flex-end}
.box:before{inset:auto -30px -50px auto;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,var(--c),transparent 68%);opacity:.5}
.box:hover{transform:translateY(-4px) scale(1.01)}
.bi{background:linear-gradient(145deg,rgba(255,255,255,.85),color-mix(in srgb,var(--c) 30%,transparent));box-shadow:inset 0 1px 0 #fff,0 6px 14px color-mix(in srgb,var(--c) 35%,transparent);margin-bottom:auto;position:relative}
.box b,.box span{position:relative}
.newbox{background:transparent;border:2px dashed var(--bd);align-items:center;justify-content:center;box-shadow:none}
.bento{grid-auto-flow:dense;grid-auto-rows:minmax(150px,auto)}
.bento .box:nth-child(6n+1){grid-column:span 2;grid-row:span 2}
.bento .box:nth-child(6n+4){grid-column:span 2}
.bento .box:nth-child(6n+1) .bi{width:68px;height:68px;font-size:36px}
.bento .box:nth-child(6n+1) b{font-size:26px;letter-spacing:-.02em}
.item{border-radius:26px}
.thumb{background:linear-gradient(135deg,color-mix(in srgb,var(--c,#888) 38%,transparent),color-mix(in srgb,var(--c,#888) 8%,transparent))}
.list .item{border-radius:22px}
.fav{backdrop-filter:blur(8px);background:rgba(255,255,255,.3)}
.tg{background:var(--card);border-color:var(--bd)}
.mb{background:rgba(40,25,80,.28);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.m{background:var(--gl2);border:1px solid var(--bd);border-radius:32px;box-shadow:var(--sh),0 30px 80px rgba(0,0,0,.25);backdrop-filter:blur(30px) saturate(180%)}
.sw{box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 4px 10px color-mix(in srgb,var(--c) 40%,transparent)}
.big{border-radius:22px}
@media(max-width:600px){header{margin:8px;padding:8px 12px}.grid{grid-template-columns:repeat(2,1fr)}.bento{grid-auto-rows:minmax(140px,auto)}.bento .box:nth-child(6n+4){grid-column:span 2}.box{border-radius:26px;padding:16px}}
/* ===== Melhorias para celular ===== */
@media (max-width: 600px) {
  header { margin: 8px; padding: 8px 12px; gap: 8px; }
  .logo { font-size: 16px; }
  .logo span { display: none; }
  header input { font-size: 15px; padding: 8px 12px; }
  main { padding: 16px 12px 100px; }
  h1 { font-size: 22px; }
  .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .bento { grid-auto-rows: minmax(130px, auto); }
  .bento .box:nth-child(6n+1) { grid-column: span 2; grid-row: span 2; }
  .bento .box:nth-child(6n+4) { grid-column: span 2; }
  .box { border-radius: 22px; padding: 14px; }
  .bi { width: 40px; height: 40px; font-size: 20px; }
  .item { border-radius: 18px; }
  .thumb { height: 110px; }
  .list .thumb { width: 56px; height: 56px; }
  .fab { right: 16px; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); padding: 14px 18px; font-size: 15px; }
  .m { border-radius: 24px; padding: 18px; max-height: 92vh; }
  .chips { gap: 6px; }
  .chip { padding: 6px 11px; font-size: 13px; }
}

/* Deixa os botões mais fáceis de tocar */
button, .chip, .box, .item {
  -webkit-tap-highlight-color: transparent;
}

/* Evita zoom automático no iPhone ao focar no input */
input, textarea, select {
  font-size: 16px !important;
}
.box:after,.item:after{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(240px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.38),transparent 60%);opacity:0;transition:opacity .25s;pointer-events:none}
.box:hover:after,.item:hover:after{opacity:1}
.box,.item{will-change:transform}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ===== Motion: liquid glass ===== */
.box,.item{transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .35s ease,border-color .3s ease}
.box .bi{transition:transform .4s cubic-bezier(.2,.9,.3,1.3)}
@media(hover:hover){
 .box:hover,.item:hover{transform:translateY(-4px) scale(1.012);box-shadow:var(--sh),0 20px 44px rgba(108,92,231,.22)}
 .box:hover .bi{transform:scale(1.1) rotate(-5deg)}
}
.pri{overflow:hidden}
.pri:not(.fab){position:relative}
.rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.5);transform:scale(0);animation:rip .55s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(1);opacity:0}}
@keyframes fabIn{from{opacity:0;transform:translateY(48px) scale(.9)}to{opacity:1;transform:none}}
.fab{animation:fabIn .6s .35s cubic-bezier(.2,.9,.3,1.15) backwards;transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s ease}
@media(hover:hover){.fab:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(108,92,231,.5),inset 0 1px 0 rgba(255,255,255,.55)}}
.fab:active{transform:scale(.94);transition-duration:.1s}
.theme-anim,.theme-anim *{transition:background-color .45s ease,color .45s ease,border-color .45s ease,box-shadow .45s ease!important}
::view-transition-old(root),::view-transition-new(root){animation-duration:.45s;animation-timing-function:cubic-bezier(.4,0,.2,1)}
/* ===== Pixel background + extra polish ===== */
#px{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
main{position:relative;z-index:1}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -5px}}
.box .bi{animation:bob 4.5s ease-in-out infinite}
.box:nth-child(2n) .bi{animation-delay:-1.2s}
.box:nth-child(3n) .bi{animation-delay:-2.4s}
.logo span{background:linear-gradient(90deg,var(--ac),#4fd1c5,#ff9a8b,var(--ac));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
@keyframes shine{to{background-position:-200% 0}}
.chip{transition:background .3s ease,color .3s ease,border-color .3s ease,transform .2s cubic-bezier(.2,.8,.2,1)}
.pri:after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);transform:translateX(-120%);transition:transform .7s cubic-bezier(.2,.8,.2,1);pointer-events:none}
@media(hover:hover){.chip:hover{transform:translateY(-2px)}.pri:hover:after{transform:translateX(120%)}}
/* ===== Polish v3: aurora, luz do cursor, detalhes ===== */
:root{--glow:rgba(255,255,255,.65)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--glow:rgba(140,120,255,.22)}}
:root[data-theme="dark"]{--glow:rgba(140,120,255,.22)}
#aurora{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
#aurora i{position:absolute;width:60vmax;height:60vmax;border-radius:50%;background:radial-gradient(circle,var(--a) 0,transparent 65%);opacity:.55;will-change:transform;animation:drift 26s ease-in-out infinite alternate}
#aurora i:nth-child(1){--a:#b9a8ff;left:-15vmax;top:-20vmax}
#aurora i:nth-child(2){--a:#8be9dc;right:-20vmax;top:5vmax;animation-duration:32s;animation-delay:-8s}
#aurora i:nth-child(3){--a:#ffc0ae;left:20vw;bottom:-30vmax;animation-duration:38s;animation-delay:-15s}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) #aurora i{opacity:.3}}
:root[data-theme="dark"] #aurora i{opacity:.3}
@keyframes drift{0%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(8vw,6vh,0) scale(1.15)}100%{transform:translate3d(-6vw,10vh,0) scale(.95)}}
#glow{position:fixed;left:0;top:0;width:440px;height:440px;margin:-220px 0 0 -220px;border-radius:50%;background:radial-gradient(circle,var(--glow),transparent 65%);pointer-events:none;z-index:0;opacity:0;transition:opacity .6s ease;will-change:transform}
header{transition:box-shadow .35s ease,transform .35s cubic-bezier(.2,.8,.2,1)}
header.sc{box-shadow:var(--sh),0 14px 34px rgba(90,70,160,.22);transform:scale(.985)}
.thumb img{transition:transform .8s cubic-bezier(.16,1,.3,1)}
@media(hover:hover){.item:hover .thumb img{transform:scale(1.08)}}
.fav{transition:color .25s ease,background .25s ease}
</style>
</head>
<body>
<header>
<div class="logo" data-a="home">🗄️ Meu <span>Vault</span></div>
<input id="q" placeholder="Buscar em tudo…" autocomplete="off">
<button data-a="theme" title="Tema">🌓</button>
</header>
<main id="main"></main>
<button class="pri fab" data-a="quick">＋ Adicionar rápido</button>
<div id="modal"></div>
<script>
const $=s=>document.querySelector(s);
const COLORS=['#5b5bd6','#e5484d','#f76b15','#e5a50a','#30a46c','#0091ff','#d6409f','#8e8c99'];
const ICONS=['📁','🔗','📸','🎬','💡','📄','🧠','✈️','🎵','⭐','🍳','📚','🏠','💼','🎮','❤️'];
const TYPES={link:['🔗','Link'],note:['📝','Nota'],photo:['🖼️','Foto'],video:['🎬','Vídeo'],file:['📄','Arquivo'],audio:['🎵','Áudio']};
const SUG=['Links para assistir','Fotos da viagem','Vídeos importantes','Ideias e referências','Documentos','Memórias'];
let S;try{S=JSON.parse(localStorage.getItem('mv'))}catch(e){}
S=S||{boxes:[]};
let route=null,q='',filt='all',view='grid',tagf=null,unlocked={},dragId=null;
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem('mv',JSON.stringify(S))}catch(e){toast('Armazenamento local cheio — remova itens grandes')}}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);d.animate([{opacity:0,transform:'translate(-50%,20px) scale(.9)'},{opacity:1,transform:'translate(-50%,0) scale(1)'}],{duration:300,easing:'cubic-bezier(.2,.9,.3,1.3)'});setTimeout(()=>{d.animate([{opacity:1},{opacity:0}],{duration:250,fill:'forwards'}).onfinish=()=>d.remove()},2000)}
const box=id=>S.boxes.find(b=>b.id===id);
const host=u=>{try{return new URL(u).hostname.replace('www.','')}catch(e){return u||''}};
const ytId=u=>(u.match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/)||[])[1];
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
function modal(h){$('#modal').innerHTML=h?`<div class="mb"><div class="m">${h}</div></div>`:'';
 if(h&&!matchMedia('(prefers-reduced-motion:reduce)').matches){document.querySelector('.mb').animate([{opacity:0},{opacity:1}],{duration:220});document.querySelector('.m').animate([{opacity:0,transform:'translateY(30px) scale(.94)'},{opacity:1,transform:'none'}],{duration:380,easing:'cubic-bezier(.2,.9,.3,1.2)'})}}
const tagsOf=t=>t.split(',').map(x=>x.trim().toLowerCase()).filter(Boolean);
const matches=i=>!q||[i.title,i.text,i.url,(i.tags||[]).join(' ')].join(' ').toLowerCase().includes(q.toLowerCase());

function card(i,b,drag){
 const c=b.color;let th;
 if(i.type==='photo'&&(i.data||i.url))th=`<img src="${esc(i.data||i.url)}" alt="" loading="lazy">`;
 else th=TYPES[i.type][0];
 const sub=i.type==='note'?esc((i.text||'').slice(0,70)):esc(host(i.url)||i.fname||'');
 return `<div class="item" style="--c:${c}" data-a="open" data-id="${i.id}" data-b="${b.id}" ${drag?'draggable="true"':''}>
 <div class="thumb">${th}</div><div class="ib"><b>${esc(i.title||'Sem título')}</b><span class="mu" style="font-size:13px">${sub}</span><div>${(i.tags||[]).map(t=>`<span class="tg" data-a="tag" data-t="${esc(t)}">#${esc(t)}</span>`).join('')}</div></div>
 <button class="fav ${i.fav?'on':''}" data-a="fav" data-id="${i.id}" data-b="${b.id}">★</button></div>`;
}
function typeChips(items){
 return `<div class="chips">${['all',...Object.keys(TYPES),'fav'].map(t=>`<button class="chip ${filt===t?'on':''}" data-a="filt" data-t="${t}">${t==='all'?'Tudo':t==='fav'?'★ Favoritos':TYPES[t][0]+' '+TYPES[t][1]}</button>`).join('')}</div>`+(tagf?`<div class="chips"><button class="chip on" data-a="tag" data-t="">#${esc(tagf)} ✕</button></div>`:'');
}
const passF=i=>(filt==='all'||(filt==='fav'?i.fav:i.type===filt))&&(!tagf||(i.tags||[]).includes(tagf))&&matches(i);

function render(){
