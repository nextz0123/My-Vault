<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meu Vault</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--tx:#1d1c1a;--mu:#7a7770;--bd:#e6e3dc;--ac:#5b5bd6;--sh:0 1px 3px rgba(0,0,0,.06),0 6px 20px rgba(0,0,0,.04);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151514;--card:#1f1e1d;--tx:#efede8;--mu:#9a968d;--bd:#2d2b29;--ac:#8b8bf0;--sh:0 1px 3px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#151514;--card:#1f1e1d;--tx:#efede8;--mu:#9a968d;--bd:#2d2b29;--ac:#8b8bf0;--sh:0 1px 3px rgba(0,0,0,.4)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--bd);background:var(--card);border-radius:10px;padding:8px 12px}
button:hover{border-color:var(--ac)}
.pri{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}
.pri:hover{opacity:.9}
input,textarea{width:100%;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:9px 12px;outline:none}
input:focus,textarea:focus{border-color:var(--ac)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:10px;align-items:center;padding:12px 20px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--bd)}
.logo{font-weight:800;font-size:18px;cursor:pointer;white-space:nowrap}
.logo span{color:var(--ac)}
header input{max-width:420px;flex:1}
.sp{flex:1}
main{max-width:1100px;margin:0 auto;padding:24px 20px 90px}
h1{font-size:26px;margin:0 0 4px}
.mu{color:var(--mu)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-top:18px}
.list{display:flex;flex-direction:column;gap:8px;margin-top:18px}
.box{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px;cursor:pointer;box-shadow:var(--sh);transition:transform .15s;position:relative;overflow:hidden}
.box:hover{transform:translateY(-3px)}
.box:before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:var(--c)}
.bi{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:color-mix(in srgb,var(--c) 22%,transparent);margin-bottom:12px}
.box b{display:block;font-size:17px}
.newbox{border:2px dashed var(--bd);background:transparent;display:grid;place-items:center;min-height:150px;color:var(--mu);font-weight:600;text-align:center;box-shadow:none}
.newbox:before{display:none}
.newbox:hover{border-color:var(--ac);color:var(--ac)}
.item{background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden;cursor:pointer;box-shadow:var(--sh);position:relative}
.item.drag{opacity:.4}
.thumb{height:140px;display:grid;place-items:center;font-size:38px;background:color-mix(in srgb,var(--c,#888) 14%,var(--bg));overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.ib{padding:10px 12px}
.ib b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tg{display:inline-block;font-size:12px;background:var(--bg);border:1px solid var(--bd);border-radius:20px;padding:0 8px;margin:4px 4px 0 0;color:var(--mu);cursor:pointer}
.fav{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.35);color:#fff;border:0;border-radius:50%;width:30px;height:30px;padding:0}
.fav.on{color:#ffc933}
.list .item{display:flex;align-items:center}
.list .thumb{width:64px;height:64px;font-size:24px;flex:none}
.list .ib{flex:1;min-width:0}
.list .fav{position:static;margin-right:10px;background:none;color:var(--mu)}
.list .fav.on{color:#e9a900}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.chip{border-radius:20px;padding:5px 12px;font-size:14px}
.chip.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));border-radius:30px;padding:14px 20px;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:6}
.mb{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:20;padding:16px}
.m{background:var(--bg);border:1px solid var(--bd);border-radius:20px;padding:22px;width:100%;max-width:520px;max-height:90vh;overflow:auto}
.m h2{margin:0 0 14px;font-size:20px}
.m label{display:block;font-size:13px;color:var(--mu);margin:12px 0 4px}
.sw{width:30px;height:30px;border-radius:50%;padding:0;background:var(--c);border:3px solid transparent}
.sw.sel{border-color:var(--tx)}
.ic{width:38px;height:38px;padding:0;font-size:19px}
.ic.sel{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 18%,transparent)}
.big{max-width:100%;max-height:340px;border-radius:12px;display:block;margin:0 auto 10px}
.empty{text-align:center;padding:50px 10px;color:var(--mu)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 16px;border-radius:20px;z-index:30}
.hid{display:none}
a{color:var(--ac)}
@media(max-width:600px){header{padding:10px 12px}.logo span{display:none}main{padding:18px 14px 90px}}
/* ===== Liquid glass + bento ===== */
:root{--bg:#ece8f2;--card:rgba(255,255,255,.5);--gl2:rgba(246,243,252,.82);--tx:#1d1b26;--mu:#6f6b80;--bd:rgba(255,255,255,.75);--ac:#6c5ce7;--sh:inset 0 1px 0 rgba(255,255,255,.9),inset 0 -1px 0 rgba(255,255,255,.25),0 12px 32px rgba(90,70,160,.16);--g:radial-gradient(55% 45% at 12% 8%,#cbbcff 0,transparent 70%),radial-gradient(45% 45% at 92% 18%,#a6f0e4 0,transparent 70%),radial-gradient(60% 55% at 78% 98%,#ffcfc0 0,transparent 70%)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12111a;--card:rgba(255,255,255,.07);--gl2:rgba(28,26,40,.88);--tx:#f1eefb;--mu:#a29fb5;--bd:rgba(255,255,255,.14);--ac:#9b8cff;--sh:inset 0 1px 0 rgba(255,255,255,.18),0 12px 32px rgba(0,0,0,.45);--g:radial-gradient(55% 45% at 12% 8%,#4a3a9455 0,transparent 70%),radial-gradient(45% 45% at 92% 18%,#1f857a44 0,transparent 70%),radial-gradient(60% 55% at 78% 98%,#9a4a6a44 0,transparent 70%)}}
:root[data-theme="dark"]{--bg:#12111a;--card:rgba(255,255,255,.07);--gl2:rgba(28,26,40,.88);--tx:#f1eefb;--mu:#a29fb5;--bd:rgba(255,255,255,.14);--ac:#9b8cff;--sh:inset 0 1px 0 rgba(255,255,255,.18),0 12px 32px rgba(0,0,0,.45);--g:radial-gradient(55% 45% at 12% 8%,#4a3a9455 0,transparent 70%),radial-gradient(45% 45% at 92% 18%,#1f857a44 0,transparent 70%),radial-gradient(60% 55% at 78% 98%,#9a4a6a44 0,transparent 70%)}
body{background:var(--g),var(--bg);background-attachment:fixed;min-height:100vh}
h1{letter-spacing:-.02em;font-weight:800}
button,input,textarea,.box,.item,header{backdrop-filter:blur(18px) saturate(170%);-webkit-backdrop-filter:blur(18px) saturate(170%)}
button{border-radius:999px;padding:8px 16px;border-color:var(--bd);box-shadow:var(--sh);transition:transform .15s,border-color .15s}
button:active{transform:scale(.96)}
input,textarea{border-radius:22px;border-color:var(--bd);box-shadow:inset 0 2px 6px rgba(90,70,160,.08)}
header{margin:10px 14px 0;top:calc(env(safe-area-inset-top,0px) + 10px);border:1px solid var(--bd);border-radius:999px;background:var(--card);box-shadow:var(--sh);padding:8px 14px}
header input{border-radius:999px}
.pri{background:linear-gradient(135deg,#9a8cff,#5b5bd6);color:#fff;border-color:rgba(255,255,255,.45);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 10px 24px rgba(108,92,231,.45)}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.box,.item{background:var(--card);border-color:var(--bd);box-shadow:var(--sh)}
.box{border-radius:30px;padding:20px;display:flex;flex-direction:column;justify-content:flex-end}
.box:before{inset:auto -30px -50px auto;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,var(--c),transparent 68%);opacity:.5}
.box:hover{transform:translateY(-4px) scale(1.01)}
.bi{background:linear-gradient(145deg,rgba(255,255,255,.85),color-mix(in srgb,var(--c) 30%,transparent));box-shadow:inset 0 1px 0 #fff,0 6px 14px color-mix(in srgb,var(--c) 35%,transparent);margin-bottom:auto;position:relative}
.box b,.box span{position:relative}
.newbox{background:transparent;border:2px dashed var(--bd);align-items:center;justify-content:center;box-shadow:none}
.bento{grid-auto-flow:dense;grid-auto-rows:minmax(150px,auto)}
.bento .box:nth-child(6n+1){grid-column:span 2;grid-row:span 2}
.bento .box:nth-child(6n+4){grid-column:span 2}
.bento .box:nth-child(6n+1) .bi{width:68px;height:68px;font-size:36px}
.bento .box:nth-child(6n+1) b{font-size:26px;letter-spacing:-.02em}
.item{border-radius:26px}
.thumb{background:linear-gradient(135deg,color-mix(in srgb,var(--c,#888) 38%,transparent),color-mix(in srgb,var(--c,#888) 8%,transparent))}
.list .item{border-radius:22px}
.fav{backdrop-filter:blur(8px);background:rgba(255,255,255,.3)}
.tg{background:var(--card);border-color:var(--bd)}
.mb{background:rgba(40,25,80,.28);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.m{background:var(--gl2);border:1px solid var(--bd);border-radius:32px;box-shadow:var(--sh),0 30px 80px rgba(0,0,0,.25);backdrop-filter:blur(30px) saturate(180%)}
.sw{box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 4px 10px color-mix(in srgb,var(--c) 40%,transparent)}
.big{border-radius:22px}
@media(max-width:600px){header{margin:8px;padding:8px 12px}.grid{grid-template-columns:repeat(2,1fr)}.bento{grid-auto-rows:minmax(140px,auto)}.bento .box:nth-child(6n+4){grid-column:span 2}.box{border-radius:26px;padding:16px}}
/* ===== Melhorias para celular ===== */
@media (max-width: 600px) {
  header { margin: 8px; padding: 8px 12px; gap: 8px; }
  .logo { font-size: 16px; }
  .logo span { display: none; }
  header input { font-size: 15px; padding: 8px 12px; }
  main { padding: 16px 12px 100px; }
  h1 { font-size: 22px; }
  .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .bento { grid-auto-rows: minmax(130px, auto); }
  .bento .box:nth-child(6n+1) { grid-column: span 2; grid-row: span 2; }
  .bento .box:nth-child(6n+4) { grid-column: span 2; }
  .box { border-radius: 22px; padding: 14px; }
  .bi { width: 40px; height: 40px; font-size: 20px; }
  .item { border-radius: 18px; }
  .thumb { height: 110px; }
  .list .thumb { width: 56px; height: 56px; }
  .fab { right: 16px; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); padding: 14px 18px; font-size: 15px; }
  .m { border-radius: 24px; padding: 18px; max-height: 92vh; }
  .chips { gap: 6px; }
  .chip { padding: 6px 11px; font-size: 13px; }
}

/* Deixa os botões mais fáceis de tocar */
button, .chip, .box, .item {
  -webkit-tap-highlight-color: transparent;
}

/* Evita zoom automático no iPhone ao focar no input */
input, textarea, select {
  font-size: 16px !important;
}
.box:after,.item:after{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(240px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.38),transparent 60%);opacity:0;transition:opacity .25s;pointer-events:none}
.box:hover:after,.item:hover:after{opacity:1}
.box,.item{will-change:transform}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ===== Motion: liquid glass ===== */
.box,.item{transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .35s ease,border-color .3s ease}
.box .bi{transition:transform .4s cubic-bezier(.2,.9,.3,1.3)}
@media(hover:hover){
 .box:hover,.item:hover{transform:translateY(-4px) scale(1.012);box-shadow:var(--sh),0 20px 44px rgba(108,92,231,.22)}
 .box:hover .bi{transform:scale(1.1) rotate(-5deg)}
}
.pri{overflow:hidden}
.pri:not(.fab){position:relative}
.rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.5);transform:scale(0);animation:rip .55s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(1);opacity:0}}
@keyframes fabIn{from{opacity:0;transform:translateY(48px) scale(.9)}to{opacity:1;transform:none}}
.fab{animation:fabIn .6s .35s cubic-bezier(.2,.9,.3,1.15) backwards;transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s ease}
@media(hover:hover){.fab:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(108,92,231,.5),inset 0 1px 0 rgba(255,255,255,.55)}}
.fab:active{transform:scale(.94);transition-duration:.1s}
.theme-anim,.theme-anim *{transition:background-color .45s ease,color .45s ease,border-color .45s ease,box-shadow .45s ease!important}
::view-transition-old(root),::view-transition-new(root){animation-duration:.45s;animation-timing-function:cubic-bezier(.4,0,.2,1)}
/* ===== Pixel background + extra polish ===== */
#px{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
main{position:relative;z-index:1}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -5px}}
.box .bi{animation:bob 4.5s ease-in-out infinite}
.box:nth-child(2n) .bi{animation-delay:-1.2s}
.box:nth-child(3n) .bi{animation-delay:-2.4s}
.logo span{background:linear-gradient(90deg,var(--ac),#4fd1c5,#ff9a8b,var(--ac));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
@keyframes shine{to{background-position:-200% 0}}
.chip{transition:background .3s ease,color .3s ease,border-color .3s ease,transform .2s cubic-bezier(.2,.8,.2,1)}
.pri:after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);transform:translateX(-120%);transition:transform .7s cubic-bezier(.2,.8,.2,1);pointer-events:none}
@media(hover:hover){.chip:hover{transform:translateY(-2px)}.pri:hover:after{transform:translateX(120%)}}
/* ===== Polish v3: aurora, luz do cursor, detalhes ===== */
:root{--glow:rgba(255,255,255,.65)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--glow:rgba(140,120,255,.22)}}
:root[data-theme="dark"]{--glow:rgba(140,120,255,.22)}
#aurora{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
#aurora i{position:absolute;width:60vmax;height:60vmax;border-radius:50%;background:radial-gradient(circle,var(--a) 0,transparent 65%);opacity:.55;will-change:transform;animation:drift 26s ease-in-out infinite alternate}
#aurora i:nth-child(1){--a:#b9a8ff;left:-15vmax;top:-20vmax}
#aurora i:nth-child(2){--a:#8be9dc;right:-20vmax;top:5vmax;animation-duration:32s;animation-delay:-8s}
#aurora i:nth-child(3){--a:#ffc0ae;left:20vw;bottom:-30vmax;animation-duration:38s;animation-delay:-15s}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) #aurora i{opacity:.3}}
:root[data-theme="dark"] #aurora i{opacity:.3}
@keyframes drift{0%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(8vw,6vh,0) scale(1.15)}100%{transform:translate3d(-6vw,10vh,0) scale(.95)}}
#glow{position:fixed;left:0;top:0;width:440px;height:440px;margin:-220px 0 0 -220px;border-radius:50%;background:radial-gradient(circle,var(--glow),transparent 65%);pointer-events:none;z-index:0;opacity:0;transition:opacity .6s ease;will-change:transform}
header{transition:box-shadow .35s ease,transform .35s cubic-bezier(.2,.8,.2,1)}
header.sc{box-shadow:var(--sh),0 14px 34px rgba(90,70,160,.22);transform:scale(.985)}
.thumb img{transition:transform .8s cubic-bezier(.16,1,.3,1)}
@media(hover:hover){.item:hover .thumb img{transform:scale(1.08)}}
.fav{transition:color .25s ease,background .25s ease}
/* ===== Configurações ===== */
#wp{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0;transition:opacity .5s ease,filter .4s ease}
#wp.on{opacity:var(--wpo,1)}
#wp.blur{filter:blur(16px);transform:scale(1.1)}
html.hasWp #aurora{display:none}
.pri{background:linear-gradient(135deg,color-mix(in srgb,var(--ac) 68%,#fff),var(--ac));color:var(--onac,#fff);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 10px 24px color-mix(in srgb,var(--ac) 45%,transparent)}
.chip.on{color:var(--onac,#fff)}
body{font-size:calc(15px*var(--fs,1))}
.box b{font-size:calc(17px*var(--fs,1))}
h1{font-size:calc(26px*var(--fs,1))}
@media(max-width:600px){h1{font-size:calc(22px*var(--fs,1))}}
html[data-dens=compact] main{padding-top:14px}
html[data-dens=compact] .grid{gap:8px}html[data-dens=compact] .list{gap:5px}
html[data-dens=compact] .box{padding:14px}html[data-dens=compact] .ib{padding:6px 10px}html[data-dens=compact] .thumb{height:104px}
html[data-dens=spacious] main{padding-top:34px}
html[data-dens=spacious] .grid{gap:22px}html[data-dens=spacious] .list{gap:14px}
html[data-dens=spacious] .box{padding:26px}html[data-dens=spacious] .ib{padding:14px 16px}html[data-dens=spacious] .thumb{height:176px}
.noanim *,.noanim *:before,.noanim *:after{animation:none!important;transition:none!important}
.noanim #glow{display:none}
html.glass2{--card:rgba(255,255,255,.32);--bd:rgba(255,255,255,.95)}
@media(prefers-color-scheme:dark){html.glass2:not([data-theme="light"]){--card:rgba(255,255,255,.09);--bd:rgba(255,255,255,.3)}}
html.glass2[data-theme="dark"]{--card:rgba(255,255,255,.09);--bd:rgba(255,255,255,.3)}
html.glass2 .box,html.glass2 .item,html.glass2 header,html.glass2 button,html.glass2 input,html.glass2 textarea{backdrop-filter:blur(34px) saturate(210%);-webkit-backdrop-filter:blur(34px) saturate(210%)}
html.glass2 .m,html.glass2 .stp{backdrop-filter:blur(50px) saturate(210%);-webkit-backdrop-filter:blur(50px) saturate(210%);background:color-mix(in srgb,var(--gl2) 72%,transparent)}
#st{position:fixed;inset:0;z-index:15;pointer-events:none;visibility:hidden;transition:visibility 0s .45s}
#st.open{pointer-events:auto;visibility:visible;transition-delay:0s}
.stbg{position:absolute;inset:0}
.stp{position:absolute;top:0;right:0;bottom:0;width:min(440px,100%);display:flex;flex-direction:column;transform:translateX(105%);transition:transform .45s cubic-bezier(.16,1,.3,1);background:var(--gl2);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);border-left:1px solid var(--bd);border-radius:28px 0 0 28px;box-shadow:var(--sh),-20px 0 60px rgba(0,0,0,.2)}
#st.open .stp{transform:none}
.sth{display:flex;justify-content:space-between;align-items:center;padding:18px 20px 6px}
.sth h2{margin:0;font-size:20px}
.stb{overflow:auto;padding:6px 20px calc(28px + env(safe-area-inset-bottom,0px));flex:1}
.stb section{background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:16px;margin-top:14px;box-shadow:var(--sh)}
.stb h3{margin:0 0 10px;font-size:15px}
.stb label{display:block;font-size:13px;color:var(--mu);margin:12px 0 6px}
.cs-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.cs{width:34px;height:34px;padding:0;border-radius:50%;border:3px solid transparent;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.cs.on{border-color:var(--tx);transform:scale(1.1)}
.seg{display:flex;gap:4px;background:var(--bg);border-radius:999px;padding:4px}
.seg button{flex:1;border:0;box-shadow:none;background:transparent;padding:7px 6px;font-size:14px}
.seg button.on{background:var(--ac);color:var(--onac,#fff)}
.srow{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:12px}
.srow span{display:block;font-size:12px}
.tgl{width:52px;height:30px;padding:3px;border-radius:999px;flex:none}
.tgl i{display:block;width:22px;height:22px;border-radius:50%;background:var(--mu);transition:transform .3s cubic-bezier(.2,.9,.3,1.2),background .3s}
.tgl.on{background:var(--ac);border-color:var(--ac)}

<body>
<header>
<div class="logo" data-a="home">🗄️ Meu <span>Vault</span></div>
<input id="q" placeholder="Buscar em tudo…" autocomplete="off">
<button data-c="open" title="Corpo">💪</button><button data-a="settings" title="Configurações">⚙️</button><button data-a="theme" title="Tema">🌓</button><button data-a="logout" title="Sair">⎋</button>
</header>
<main id="main"></main>
<button class="pri fab" data-a="quick">＋ Adicionar rápido</button>
<div id="modal"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const $=s=>document.querySelector(s);
const COLORS=['#5b5bd6','#e5484d','#f76b15','#e5a50a','#30a46c','#0091ff','#d6409f','#8e8c99'];
const ICONS=['📁','🔗','📸','🎬','💡','📄','🧠','✈️','🎵','⭐','🍳','📚','🏠','💼','🎮','❤️'];
const TYPES={link:['🔗','Link'],note:['📝','Nota'],photo:['🖼️','Foto'],video:['🎬','Vídeo'],file:['📄','Arquivo'],audio:['🎵','Áudio']};
const SUG=['Links para assistir','Fotos da viagem','Vídeos importantes','Ideias e referências','Documentos','Memórias'];
let S={boxes:[]};
let route=null,q='',filt='all',view='grid',tagf=null,unlocked={},dragId=null;
const uid=()=>crypto.randomUUID();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){queueSync()}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);d.animate([{opacity:0,transform:'translate(-50%,20px) scale(.9)'},{opacity:1,transform:'translate(-50%,0) scale(1)'}],{duration:300,easing:'cubic-bezier(.2,.9,.3,1.3)'});setTimeout(()=>{d.animate([{opacity:1},{opacity:0}],{duration:250,fill:'forwards'}).onfinish=()=>d.remove()},2000)}
const box=id=>S.boxes.find(b=>b.id===id);
const host=u=>{try{return new URL(u).hostname.replace('www.','')}catch(e){return u||''}};
const ytId=u=>(u.match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/)||[])[1];
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
function modal(h){$('#modal').innerHTML=h?`<div class="mb"><div class="m">${h}</div></div>`:'';
 if(h&&!matchMedia('(prefers-reduced-motion:reduce)').matches){document.querySelector('.mb').animate([{opacity:0},{opacity:1}],{duration:220});document.querySelector('.m').animate([{opacity:0,transform:'translateY(30px) scale(.94)'},{opacity:1,transform:'none'}],{duration:380,easing:'cubic-bezier(.2,.9,.3,1.2)'})}}
const tagsOf=t=>t.split(',').map(x=>x.trim().toLowerCase()).filter(Boolean);
const matches=i=>!q||[i.title,i.text,i.url,(i.tags||[]).join(' ')].join(' ').toLowerCase().includes(q.toLowerCase());

function card(i,b,drag){
 const c=b.color;let th;
 if(i.type==='photo'&&(i.data||i.url))th=`<img src="${esc(i.data||i.url)}" alt="" loading="lazy">`;
 else th=TYPES[i.type][0];
 const sub=i.type==='note'?esc((i.text||'').slice(0,70)):esc(host(i.url)||i.fname||'');
 return `<div class="item" style="--c:${c}" data-a="open" data-id="${i.id}" data-b="${b.id}" ${drag?'draggable="true"':''}>
 <div class="thumb">${th}</div><div class="ib"><b>${esc(i.title||'Sem título')}</b><span class="mu" style="font-size:13px">${sub}</span><div>${(i.tags||[]).map(t=>`<span class="tg" data-a="tag" data-t="${esc(t)}">#${esc(t)}</span>`).join('')}</div></div>
 <button class="fav ${i.fav?'on':''}" data-a="fav" data-id="${i.id}" data-b="${b.id}">★</button></div>`;
}
function typeChips(items){
 return `<div class="chips">${['all',...Object.keys(TYPES),'fav'].map(t=>`<button class="chip ${filt===t?'on':''}" data-a="filt" data-t="${t}">${t==='all'?'Tudo':t==='fav'?'★ Favoritos':TYPES[t][0]+' '+TYPES[t][1]}</button>`).join('')}</div>`+(tagf?`<div class="chips"><button class="chip on" data-a="tag" data-t="">#${esc(tagf)} ✕</button></div>`:'');
}
const passF=i=>(filt==='all'||(filt==='fav'?i.fav:i.type===filt))&&(!tagf||(i.tags||[]).includes(tagf))&&matches(i);

function render(){
 const m=$('#main');
 if(q&&!route){
  const r=[];S.boxes.forEach(b=>{if(b.pass)return;b.items.filter(matches).forEach(i=>r.push(card(i,b)))});
  m.innerHTML=`<h1>Resultados</h1><p class="mu">${r.length} item(ns) (caixas com senha ficam fora da busca global)</p><div class="grid">${r.join('')}</div>`;return;
 }
 if(route){
  const b=box(route);if(!b){route=null;return render()}
  if(b.pass&&!unlocked[b.id]){m.innerHTML=`<div class="empty"><div style="font-size:48px">🔒</div><h2>${esc(b.name)}</h2><p>Esta caixa tem senha.</p><div style="max-width:260px;margin:auto"><input id="pw" type="password" placeholder="Senha"><br><br><button class="pri" data-a="unlock" data-b="${b.id}">Abrir</button></div></div>`;return}
  const items=b.items.filter(passF);const can=!q&&filt==='all'&&!tagf&&view==='grid'||false;
  m.innerHTML=`<div class="row"><button data-a="home">← Caixas</button><div class="sp"></div><button data-a="view">${view==='grid'?'☰ Lista':'▦ Grade'}</button><button data-a="share">🔗 Compartilhar</button><button data-a="editbox">✏️ Editar</button></div>
  <div class="row" style="margin-top:18px"><div class="bi" style="--c:${b.color};margin:0">${b.icon}</div><div><h1>${esc(b.name)}${b.pass?' 🔒':''}</h1><span class="mu">${b.items.length} itens</span></div></div>
  <div class="row" style="margin-top:14px"><button class="pri" data-a="additem">＋ Novo item</button></div>${typeChips()}
  ${items.length?`<div class="${view}" id="items">${items.map(i=>card(i,b,can)).join('')}</div>`:`<div class="empty"><div style="font-size:44px">📭</div><p>${b.items.length?'Nada encontrado com esses filtros.':'Caixa vazia. Adicione links, fotos, notas, vídeos…'}</p></div>`}`;
  const s=$('#q');return;
 }
 m.innerHTML=`<div class="row"><div><h1>Minhas caixas</h1><span class="mu">Seu espaço pessoal organizado.</span></div><div class="sp"></div><button class="pri" data-a="newbox" style="padding:12px 20px;font-size:16px">＋ Criar nova caixa</button></div>
 ${S.boxes.length?'':`<div class="empty"><div style="font-size:54px">🗄️</div><h2 style="color:var(--tx)">Bem-vindo ao seu Vault</h2><p>Crie sua primeira caixa — ou comece com uma sugestão:</p><div class="row" style="justify-content:center">${SUG.map(s=>`<button class="chip" data-a="sug" data-n="${s}">${s}</button>`).join('')}</div></div>`}
 <div class="grid bento">${S.boxes.map(b=>`<div class="box" style="--c:${b.color}" data-a="go" data-b="${b.id}"><div class="bi">${b.icon}</div><b>${esc(b.name)}${b.pass?' 🔒':''}</b><span class="mu">${b.items.length} itens</span></div>`).join('')}
 ${S.boxes.length?`<div class="box newbox" data-a="newbox"><div>＋<br>Nova caixa</div></div>`:''}</div>`;
}

function boxForm(b){
 b=b||{name:'',color:COLORS[0],icon:ICONS[0]};
 modal(`<h2>${b.id?'Editar caixa':'Nova caixa'}</h2><label>Nome</label><input id="bn" value="${esc(b.name)}" placeholder="Ex.: Fotos da viagem">
 <label>Ícone</label><div class="row">${ICONS.map(i=>`<button class="ic ${i===b.icon?'sel':''}" data-a="pick" data-k="ic" data-v="${i}">${i}</button>`).join('')}</div>
 <label>Cor</label><div class="row">${COLORS.map(c=>`<button class="sw ${c===b.color?'sel':''}" style="--c:${c}" data-a="pick" data-k="sw" data-v="${c}"></button>`).join('')}</div>
 <label>Senha (opcional)${b.pass?' — deixe vazio para manter; digite "-" para remover':''}</label><input id="bp" type="password" placeholder="Sem senha">
 <div class="row" style="margin-top:20px">${b.id?`<button data-a="delbox" data-b="${b.id}" style="color:#e5484d">Excluir</button>`:''}<div class="sp"></div><button data-a="close">Cancelar</button><button class="pri" data-a="savebox" data-b="${b.id||''}">Salvar</button></div>`);
 setTimeout(()=>$('#bn')&&$('#bn').focus(),50);
}
function itemForm(bid,pre){
 pre=pre||{};const t=pre.type||'link';
 modal(`<h2>Novo item</h2><div class="row">${Object.entries(TYPES).map(([k,v])=>`<button class="chip ${k===t?'on':''}" data-a="itype" data-t="${k}">${v[0]} ${v[1]}</button>`).join('')}</div>
 <input type="hidden" id="it" value="${t}">
 <label>Caixa</label><div class="row" id="bsel">${S.boxes.map(b=>`<button class="chip ${b.id===bid?'on':''}" data-a="pickbox" data-b="${b.id}">${b.icon} ${esc(b.name)}</button>`).join('')}</div>
 <label>Título</label><input id="ti" placeholder="Opcional">
 <div id="f-url"><label>Link / URL</label><input id="iu" value="${esc(pre.url||'')}" placeholder="https://…"></div>
 <div id="f-text"><label>Texto</label><textarea id="ix" rows="5"></textarea></div>
 <div id="f-file"><label>Arquivo do dispositivo</label><input id="if" type="file"></div>
 <label>Tags (separe por vírgula)</label><input id="ig" placeholder="viagem, ideia">
 <div class="row" style="margin-top:20px"><div class="sp"></div><button data-a="close">Cancelar</button><button class="pri" data-a="saveitem">Adicionar</button></div>`);
 modal.bid=bid;setType(t);
}
function setType(t){
 $('#it').value=t;

/* ===== Corpo (medidas, treinos e acompanhamento) — dados no localStorage ===== */
const BCATS=['Iniciante','Intermediário','Avançado','Força','Resistência','Mobilidade','Outro'];
const BMEAS=[['chest','Peito'],['waist','Cintura'],['hip','Quadril'],['arm','Braço'],['thigh','Coxa'],['calf','Panturrilha'],['shoulder','Ombros'],['neck','Pescoço']];
const BFEEL=['😫','😐','🙂','💪'];
let bodyMode=false,bTab='sum',bCat='all',bRange='all',bFresh=false,BD=null;
const bKey=()=>'mv_body'+(user?'_'+user.id:'');
function bLoad(){
 let x=null;try{x=JSON.parse(localStorage.getItem(bKey()))}catch(e){}
 BD=Object.assign({height:'',goal:12,entries:[],plans:[],logs:[],notes:[]},x&&typeof x==='object'?x:{});
 ['entries','plans','logs','notes'].forEach(k=>{if(!Array.isArray(BD[k]))BD[k]=[]});
}
function bSave(){try{localStorage.setItem(bKey(),JSON.stringify(BD))}catch(e){toast('Sem espaço para salvar')}}
function bGet(){if(!BD)bLoad();return BD}
function bMerge(x){
 bLoad();if(x.height)BD.height=x.height;if(x.goal)BD.goal=x.goal;
 ['entries','plans','logs','notes'].forEach(k=>{const ids=new Set(BD[k].map(i=>i.id));(Array.isArray(x[k])?x[k]:[]).forEach(i=>{if(i&&i.id&&!ids.has(i.id))BD[k].push(i)})});
 bSave();
}
/* helpers */
const bP2=n=>String(n).padStart(2,'0');
const bYmd=d=>d.getFullYear()+'-'+bP2(d.getMonth()+1)+'-'+bP2(d.getDate());
const bToday=()=>bYmd(new Date());
const bPd=s=>new Date(s+'T12:00:00');
const bFd=(s,o)=>bPd(s).toLocaleDateString('pt-BR',o||{day:'2-digit',month:'short'});
const bNum=v=>{const n=parseFloat(String(v==null?'':v).replace(',','.'));return isFinite(n)&&n>0?n:null};
const bFmt=n=>String(Math.round(n*10)/10).replace('.',',');
const bWeekStart=()=>{const d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7));return bYmd(d)};
const bCmp=(a,b)=>a<b?1:a>b?-1:0;
const bEntries=()=>BD.entries.slice().sort((a,b)=>bCmp(a.d,b.d));
const bLogsDesc=()=>BD.logs.slice().sort((a,b)=>bCmp(a.d,b.d));
const bWeights=()=>BD.entries.filter(e=>e.kg).sort((a,b)=>bCmp(b.d,a.d));
const bCount=()=>{const t=bToday(),w=bWeekStart();return{wk:BD.logs.filter(l=>l.d>=w).length,mo:BD.logs.filter(l=>l.d.slice(0,7)===t.slice(0,7)).length}};
function bAddEntry(d,p){
 let e=BD.entries.find(x=>x.d===d);
 if(!e){e={id:uid(),d,kg:null,fat:null,m:{}};BD.entries.push(e)}
 if(p.kg)e.kg=p.kg;if(p.fat)e.fat=p.fat;e.m=Object.assign(e.m||{},p.m||{});bSave();
}
/* gráfico de peso (SVG puro) */
function bChart(ws){
 if(bRange!=='all'){const lim=Date.now()-(+bRange)*864e5;ws=ws.filter(e=>bPd(e.d).getTime()>=lim)}
 if(!ws.length)return '<p class="mu" style="text-align:center;padding:26px 0;margin:0">Sem pesagens neste período.</p>';
 const W=320,H=150,pl=36,pr=12,pt=12,pb=26;
 const xs=ws.map(e=>bPd(e.d).getTime()),ys=ws.map(e=>e.kg);
 const x0=Math.min(...xs),x1=Math.max(...xs);let y0=Math.min(...ys),y1=Math.max(...ys);
 if(y0===y1){y0-=1;y1+=1}else{const p=(y1-y0)*.15;y0-=p;y1+=p}
 const X=t=>x1===x0?pl+(W-pl-pr)/2:pl+(t-x0)/(x1-x0)*(W-pl-pr);
 const Y=v=>pt+(1-(v-y0)/(y1-y0))*(H-pt-pb);
 const pts=ws.map((e,i)=>[X(xs[i]),Y(ys[i])]);
 const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join('');
 const area=line+'L'+pts[pts.length-1][0].toFixed(1)+' '+(H-pb)+'L'+pts[0][0].toFixed(1)+' '+(H-pb)+'Z';
 const tx='style="fill:var(--mu);font-size:10px"';
 let g='';
 [0,.5,1].forEach(f=>{const v=y0+(y1-y0)*f,y=Y(v);g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'" style="stroke:var(--bd);stroke-width:1"/><text x="'+(pl-6)+'" y="'+(y+3).toFixed(1)+'" text-anchor="end" '+tx+'>'+bFmt(v)+'</text>'});
 const dots=ws.length<=40?pts.map(p=>'<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3.5" style="fill:var(--ac);stroke:var(--bg);stroke-width:1.5"/>').join(''):'';
 const fmtD=e=>bFd(e.d,{day:'2-digit',month:'short'});
 return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Evolução do peso"><defs><linearGradient id="bgr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--ac);stop-opacity:.35"/><stop offset="1" style="stop-color:var(--ac);stop-opacity:0"/></linearGradient></defs>'+g
  +'<path d="'+area+'" fill="url(#bgr)"/><path d="'+line+'" fill="none" style="stroke:var(--ac);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round"/>'+dots
  +'<text x="'+pl+'" y="'+(H-8)+'" '+tx+'>'+fmtD(ws[0])+'</text>'+(ws.length>1?'<text x="'+(W-pr)+'" y="'+(H-8)+'" text-anchor="end" '+tx+'>'+fmtD(ws[ws.length-1])+'</text>':'')+'</svg>';
}
/* ---- abas ---- */
function bSum(){
 const ws=bWeights(),last=ws[ws.length-1],prev=ws[ws.length-2],h=bNum(BD.height);
 const imc=last&&h?last.kg/Math.pow(h/100,2):null;
 const imcL=imc?(imc<18.5?'Abaixo':imc<25?'Normal':imc<30?'Sobrepeso':'Obesidade'):'';
 const fatE=BD.entries.filter(e=>e.fat).sort((a,b)=>bCmp(a.d,b.d))[0];
 const c=bCount(),goal=BD.goal||12,pct=Math.min(100,Math.round(c.mo/goal*100)),dl=last&&prev?last.kg-prev.kg:null;
 const ws0=bWeekStart(),done=new Set(BD.logs.map(l=>l.d)),t=bToday(),DN=['S','T','Q','Q','S','S','D'];
 let wk='';for(let i=0;i<7;i++){const d=bPd(ws0);d.setDate(d.getDate()+i);const s=bYmd(d);wk+='<div class="'+(done.has(s)?'on':'')+(s===t?' td':'')+'"><i>'+(done.has(s)?'✓':'')+'</i>'+DN[i]+'</div>'}
 return '<div class="bstats">'
 +'<div class="bs"><span>⚖️</span><b>'+(last?bFmt(last.kg)+'<small> kg</small>':'—')+'</b><small>'+(dl!=null?(dl>0?'▲ ':dl<0?'▼ ':'= ')+bFmt(Math.abs(dl))+' kg':'Peso atual')+'</small></div>'
 +'<div class="bs"><span>📐</span><b>'+(imc?bFmt(imc):'—')+'</b><small>'+(imc?'IMC · '+imcL:h?'IMC':'Defina a altura')+'</small></div>'
 +'<div class="bs"><span>🔥</span><b>'+(fatE?bFmt(fatE.fat)+'<small>%</small>':'—')+'</b><small>Gordura corporal</small></div>'
 +'<div class="bs"><span>🏋️</span><b>'+c.wk+'</b><small>Treinos na semana</small></div></div>'
 +'<div class="bcard"><div class="row"><b>Meta do mês</b><div class="sp"></div><button data-c="goal" style="padding:4px 12px;font-size:13px">'+c.mo+'/'+goal+' ✎</button></div>'
 +'<div class="pbar"><i style="width:'+pct+'%"></i></div><small class="mu">'+(c.mo>=goal?'🎉 Meta batida! '+c.mo+' treinos este mês':'Faltam '+(goal-c.mo)+' treino(s) para a meta · '+pct+'%')+'</small>'
 +'<div class="wk">'+wk+'</div></div>'
 +'<div class="bcard"><div class="row"><b>Evolução do peso</b><div class="sp"></div><div class="seg" style="width:auto">'+[['all','Tudo'],['90','90d'],['30','30d']].map(r=>'<button data-c="range" data-v="'+r[0]+'" class="'+(bRange===r[0]?'on':'')+'" style="padding:5px 12px">'+r[1]+'</button>').join('')+'</div></div>'+bChart(ws)+'</div>'
 +'<div class="row"><button class="pri" data-c="wnew">⚖️ Peso de hoje</button><button data-c="lognew">✓ Registrar treino</button></div>';
}
function bMed(){
 const es=bEntries();let tiles='';
 BMEAS.forEach(([k,n])=>{
  const a=es.filter(e=>e.m&&e.m[k]);if(!a.length)return;
  const c=a[0].m[k],p=a[1]?a[1].m[k]:null,dl=p!=null?c-p:null;
  tiles+='<div class="bs"><small>'+n+'</small><b>'+bFmt(c)+'<small> cm</small></b><small>'+(dl==null?'&nbsp;':dl>0?'▲ '+bFmt(dl):dl<0?'▼ '+bFmt(-dl):'= igual')+'</small></div>';
 });
 const list=es.map(e=>{
  const parts=[e.fat&&bFmt(e.fat)+'% gordura'].concat(BMEAS.filter(([k])=>e.m&&e.m[k]).map(([k,n])=>n+' '+bFmt(e.m[k]))).filter(Boolean).join(' · ');
  return '<div class="bit" data-c="editentry" data-id="'+e.id+'"><div class="bdate"><b>'+bFd(e.d,{day:'2-digit'})+'</b><small>'+bFd(e.d,{month:'short'})+'</small></div><div class="bimain"><b>'+(e.kg?bFmt(e.kg)+' kg':'Medidas')+'</b><span class="mu">'+esc(parts||bFd(e.d,{year:'numeric'}))+'</span></div><span class="mu">›</span></div>';
 }).join('');
 return '<div class="bcard"><div class="row" style="margin-bottom:0"><div style="flex:1;min-width:120px"><b>Altura (cm)</b><input id="b_h" inputmode="decimal" placeholder="Ex.: 175" value="'+esc(BD.height||'')+'" style="margin-top:6px"></div><button class="pri" data-c="saveh" style="align-self:flex-end">Salvar</button></div></div>'
 +'<div class="row"><button class="pri" data-c="newentry">＋ Nova medição</button><button data-c="wnew">⚖️ Peso de hoje</button></div>'

}

function logForm(pid,id){
 const l=id?BD.logs.find(x=>x.id===id):{d:bToday(),pid:pid||'',feel:2,note:''};if(!l)return;
 modal('<h2>'+(id?'Editar treino':'Treino feito ✓')+'</h2><label>Plano</label><select id="bl_p"><option value="">Treino livre</option>'+BD.plans.map(p=>'<option value="'+p.id+'"'+(p.id===l.pid?' selected':'')+'>'+esc(p.name)+'</option>').join('')+'</select>'
 +'<label>Título (para treino livre)</label><input id="bl_n" value="'+esc(l.pid?'':l.pn||'')+'" placeholder="Ex.: Treino na rua">'
 +'<label>Data</label><input id="bl_d" type="date" value="'+l.d+'">'
 +'<label>Como se sentiu?</label><div class="row" id="bl_f">'+BFEEL.map((f,i)=>'<button class="chip '+(i===l.feel?'on':'')+'" data-c="feel" data-v="'+i+'" style="font-size:20px">'+f+'</button>').join('')+'</div>'
 +'<label>Anotações</label><textarea id="bl_x" rows="3" placeholder="Progresso, cargas, sensações…">'+esc(l.note||'')+'</textarea>'
 +'<div class="row" style="margin-top:20px">'+(id?'<button data-c="dellog" data-id="'+id+'" style="color:#e5484d">Excluir</button>':'')+'<div class="sp"></div><button data-a="close">Cancelar</button><button class="pri" data-c="savelog" data-id="'+(id||'')+'">Salvar</button></div>');
}
function entryForm(id){
 const e=id?BD.entries.find(x=>x.id===id):{d:bToday(),kg:'',fat:'',m:{}};if(!e)return;
 modal('<h2>'+(id?'Editar medição':'Nova medição')+'</h2><label>Data</label><input id="be_d" type="date" value="'+e.d+'">'
 +'<div class="bg2"><div><label>Peso (kg)</label><input id="be_kg" inputmode="decimal" value="'+(e.kg||'')+'"></div><div><label>Gordura (%)</label><input id="be_fat" inputmode="decimal" value="'+(e.fat||'')+'" placeholder="Opcional"></div></div>'
 +'<label>Medidas em cm (opcional)</label><div class="bg2">'+BMEAS.map(([k,n])=>'<div><label style="margin-top:0">'+n+'</label><input id="be_'+k+'" inputmode="decimal" value="'+((e.m&&e.m[k])||'')+'"></div>').join('')+'</div>'
 +'<div class="row" style="margin-top:20px">'+(id?'<button data-c="delentry" data-id="'+id+'" style="color:#e5484d">Excluir</button>':'')+'<div class="sp"></div><button data-a="close">Cancelar</button><button class="pri" data-c="saveentry" data-id="'+(id||'')+'">Salvar</button></div>');
}
function bSample(){
 const mk=(name,cat,desc,ex)=>({id:uid(),name,cat,desc,ex:ex.map(a=>({n:a[0],s:a[1],r:a[2],t:a[3],o:a[4]||''}))});
 BD.plans.push(
  mk('Full Body — Base','Iniciante','3x por semana, em dias alternados. Foque na técnica antes da dificuldade.',[['Flexão inclinada','3','8-12','60s','Mãos apoiadas num banco ou mesa'],['Agachamento livre','3','15','60s'],['Remada invertida','3','8-10','90s','Sob uma mesa firme ou barra baixa'],['Prancha','3','30s','45s'],['Pendurar na barra','3','20s','60s','Ombros ativos']]),
  mk('Push / Pull','Intermediário','4x por semana, alternando empurrar e puxar.',[['Barra fixa','4','6-8','90s'],['Flexão diamante','4','10','60s'],['Paralelas (dips)','4','8','90s'],['Avanço búlgaro','3','10 por perna','60s'],['Elevação de pernas','3','12','60s']]),
  mk('Força Avançada','Avançado','Foco em habilidades e força máxima. Descanse bem entre as séries.',[['Pistol squat','4','5 por perna','120s'],['Flexão em parada de mão (parede)','4','5','120s'],['Barra explosiva / muscle-up','4','3','120s'],['L-sit','4','15s','90s'],['Front lever tuck','4','10s','120s']])
 );
 bSave();
}
/* ---- ações ---- */
const BA={
 open(){if(!user)return;closeSt();bLoad();bodyMode=true;route=null;q='';$('#q').value='';$('#q2').value='';favMode=false;lastKey='';bFresh=true;render();scrollTo(0,0)},
 tab(d){bTab=d.v;bFresh=true;render()},
 range(d){bRange=d.v;render()},
 cat(d){bCat=d.v;render()},
 goal(){const v=prompt('Meta de treinos por mês:',BD.goal||12);if(v===null)return;const n=parseInt(v,10);if(n>=1&&n<=62){BD.goal=n;bSave();render()}else toast('Informe um número entre 1 e 62')},
 saveh(){const v=$('#b_h').value.trim();if(v&&!bNum(v))return toast('Altura inválida');BD.height=v?String(bNum(v)):'';bSave();render();toast('Altura salva')},
 wnew(){const l=bWeights().pop();modal('<h2>⚖️ Peso de hoje</h2><label>Peso (kg)</label><input id="bw_kg" inputmode="decimal" placeholder="Ex.: 72,4" value="'+(l?l.kg:'')+'"><label>Data</label><input id="bw_d" type="date" value="'+bToday()+'"><div class="row" style="margin-top:20px"><div class="sp"></div><button data-a="close">Cancelar</button><button class="pri" data-c="wsave">Salvar</button></div>');setTimeout(()=>{const i=$('#bw_kg');if(i){i.focus();i.select()}},80)},
 wsave(){const kg=bNum($('#bw_kg').value),d=$('#bw_d').value;if(!kg||!d)return toast('Informe peso e data');bAddEntry(d,{kg});modal('');render();toast('Peso salvo ⚖️')},
 newentry(){entryForm()},
 editentry(d){entryForm(d.id)},
 saveentry(d){
  const dt=$('#be_d').value,kg=bNum($('#be_kg').value),fat=bNum($('#be_fat').value),m={};
  BMEAS.forEach(([k])=>{const v=bNum($('#be_'+k).value);if(v)m[k]=v});
  if(!dt)return toast('Informe a data');
  if(!kg&&!fat&&!Object.keys(m).length)return toast('Preencha ao menos um valor');
  if(d.id){const e=BD.entries.find(x=>x.id===d.id);if(e){e.d=dt;e.kg=kg;e.fat=fat;e.m=m}bSave()}else bAddEntry(dt,{kg,fat,m});
  modal('');render();toast('Medição salva')},
 delentry(d){if(confirm('Excluir esta medição?')){BD.entries=BD.entries.filter(x=>x.id!==d.id);bSave();modal('');render()}},
 newplan(){planForm()},
 plan(d){planDetail(d.id)},
 editplan(d){planForm(d.id)},
 addex(){$('#bp_ex').insertAdjacentHTML('beforeend',bExRow({}));const r=document.querySelectorAll('#bp_ex .x_n');r[r.length-1].focus()},
 rmex(d,t){t.closest('.exr').remove()},
 pcat(d,t){document.querySelectorAll('#bp_c .chip').forEach(x=>x.classList.toggle('on',x===t))},
 saveplan(d){
  const name=$('#bp_n').value.trim();if(!name)return toast('Dê um nome ao plano');
  const cat=(document.querySelector('#bp_c .chip.on')||{dataset:{v:'Outro'}}).dataset.v;
  const v=(r,c)=>r.querySelector(c).value.trim();
  const ex=[...document.querySelectorAll('#bp_ex .exr')].map(r=>({n:v(r,'.x_n'),s:v(r,'.x_s'),r:v(r,'.x_r'),t:v(r,'.x_t'),o:v(r,'.x_o')})).filter(x=>x.n);
  const desc=$('#bp_d').value.trim();
  if(d.id){const p=BD.plans.find(x=>x.id===d.id);if(p)Object.assign(p,{name,desc,cat,ex})}else BD.plans.push({id:uid(),name,desc,cat,ex});
  bSave();modal('');render();toast('Plano salvo')},
 delplan(d){if(confirm('Excluir este plano? O histórico de treinos é mantido.')){BD.plans=BD.plans.filter(x=>x.id!==d.id);bSave();modal('');render()}},
 dup(d){const p=BD.plans.find(x=>x.id===d.id);if(!p)return;const c=JSON.parse(JSON.stringify(p));c.id=uid();c.name=p.name+' (cópia)';BD.plans.push(c);bSave();modal('');render();toast('Plano duplicado ⧉')},
 sample(){bSample();render();toast('Planos de exemplo adicionados')},
 done(d){logForm(d.id)},
 lognew(){logForm('')},
 editlog(d){logForm('',d.id)},
 feel(d,t){document.querySelectorAll('#bl_f .chip').forEach(x=>x.classList.toggle('on',x===t))},
 savelog(d){
  const dt=$('#bl_d').value;if(!dt)return toast('Informe a data');
  const pid=$('#bl_p').value,p=BD.plans.find(x=>x.id===pid),fe=document.querySelector('#bl_f .chip.on');
  const o={d:dt,pid:pid||'',pn:p?p.name:($('#bl_n').value.trim()||'Treino livre'),feel:fe?+fe.dataset.v:2,note:$('#bl_x').value.trim()};
  if(d.id){const l=BD.logs.find(x=>x.id===d.id);if(l)Object.assign(l,o)}else BD.logs.push(Object.assign({id:uid(),ts:Date.now()},o));
  bSave();modal('');render();toast('Treino registrado ✓')},
 dellog(d){if(confirm('Excluir este treino do histórico?')){BD.logs=BD.logs.filter(x=>x.id!==d.id);bSave();modal('');render()}},
 addnote(){const t=$('#b_nt').value.trim();if(!t)return toast('Escreva algo primeiro');BD.notes.push({id:uid(),d:bToday(),t,ts:Date.now()});bSave();render();toast('Anotação salva')},
 delnote(d){if(confirm('Excluir anotação?')){BD.notes=BD.notes.filter(x=>x.id!==d.id);bSave();render()}}
};
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-c]');if(!t||!BA[t.dataset.c])return;
 if(t.dataset.c!=='open'&&!BD)bLoad();
 BA[t.dataset.c](t.dataset,t,e);
});
/* sair do modo Corpo ao navegar para outras telas */
document.addEventListener('click',e=>{
 if(!bodyMode)return;
 if(e.target.closest('[data-a=home],[data-a=go],[data-m=home],[data-m=favs],[data-a=logout]')){bodyMode=false;if(e.target.closest('[data-a=logout]'))BD=null}
},true);
/* render: tela Corpo + atalho na tela inicial */
const _rbody=render;
render=function(){
 if(bodyMode&&user&&!route&&!q){renderBody();return}
 _rbody();
 const m=$('#main');
 if(user&&m.dataset.view==='home'){
  const g=m.querySelector('.bento');
  if(g&&!g.querySelector('[data-c=open]')){
   const h='<div class="box" style="--c:#30a46c" data-c="open"><div class="bi">💪</div><b>Corpo</b><span class="mu">Medidas e treinos</span></div>',nb=g.querySelector('.newbox');
   if(nb)nb.insertAdjacentHTML('beforebegin',h);else g.insertAdjacentHTML('beforeend',h);
  }
 }
};
applyP();
boot();
</script>
</body>
</html>
