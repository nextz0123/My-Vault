<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meu Vault</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--tx:#1d1c1a;--mu:#7a7770;--bd:#e6e3dc;--ac:#5b5bd6;--sh:0 1px 3px rgba(0,0,0,.06),0 6px 20px rgba(0,0,0,.04);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151514;--card:#1f1e1d;--tx:#efede8;--mu:#9a968d;--bd:#2d2b29;--ac:#8b8bf0;--sh:0 1px 3px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#151514;--card:#1f1e1d;--tx:#efede8;--mu:#9a968d;--bd:#2d2b29;--ac:#8b8bf0;--sh:0 1px 3px rgba(0,0,0,.4)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--bd);background:var(--card);border-radius:10px;padding:8px 12px}
button:hover{border-color:var(--ac)}
.pri{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}
.pri:hover{opacity:.9}
input,textarea{width:100%;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:9px 12px;outline:none}
input:focus,textarea:focus{border-color:var(--ac)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:10px;align-items:center;padding:12px 20px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--bd)}
.logo{font-weight:800;font-size:18px;cursor:pointer;white-space:nowrap}
.logo span{color:var(--ac)}
header input{max-width:420px;flex:1}
.sp{flex:1}
main{max-width:1100px;margin:0 auto;padding:24px 20px 90px}
h1{font-size:26px;margin:0 0 4px}
.mu{color:var(--mu)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-top:18px}
.list{display:flex;flex-direction:column;gap:8px;margin-top:18px}
.box{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px;cursor:pointer;box-shadow:var(--sh);transition:transform .15s;position:relative;overflow:hidden}
.box:hover{transform:translateY(-3px)}
.box:before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:var(--c)}
.bi{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:color-mix(in srgb,var(--c) 22%,transparent);margin-bottom:12px}
.box b{display:block;font-size:17px}
.newbox{border:2px dashed var(--bd);background:transparent;display:grid;place-items:center;min-height:150px;color:var(--mu);font-weight:600;text-align:center;box-shadow:none}
.newbox:before{display:none}
.newbox:hover{border-color:var(--ac);color:var(--ac)}
.item{background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden;cursor:pointer;box-shadow:var(--sh);position:relative}
.item.drag{opacity:.4}
.thumb{height:140px;display:grid;place-items:center;font-size:38px;background:color-mix(in srgb,var(--c,#888) 14%,var(--bg));overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.ib{padding:10px 12px}
.ib b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tg{display:inline-block;font-size:12px;background:var(--bg);border:1px solid var(--bd);border-radius:20px;padding:0 8px;margin:4px 4px 0 0;color:var(--mu);cursor:pointer}
.fav{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.35);color:#fff;border:0;border-radius:50%;width:30px;height:30px;padding:0}
.fav.on{color:#ffc933}
.list .item{display:flex;align-items:center}
.list .thumb{width:64px;height:64px;font-size:24px;flex:none}
.list .ib{flex:1;min-width:0}
.list .fav{position:static;margin-right:10px;background:none;color:var(--mu)}
.list .fav.on{color:#e9a900}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.chip{border-radius:20px;padding:5px 12px;font-size:14px}
.chip.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));border-radius:30px;padding:14px 20px;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:6}
.mb{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:20;padding:16px}
.m{background:var(--bg);border:1px solid var(--bd);border-radius:20px;padding:22px;width:100%;max-width:520px;max-height:90vh;overflow:auto}
.m h2{margin:0 0 14px;font-size:20px}
.m label{display:block;font-size:13px;color:var(--mu);margin:12px 0 4px}
.sw{width:30px;height:30px;border-radius:50%;padding:0;background:var(--c);border:3px solid transparent}
.sw.sel{border-color:var(--tx)}
.ic{width:38px;height:38px;padding:0;font-size:19px}
.ic.sel{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 18%,transparent)}
.big{max-width:100%;max-height:340px;border-radius:12px;display:block;margin:0 auto 10px}
.empty{text-align:center;padding:50px 10px;color:var(--mu)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 16px;border-radius:20px;z-index:30}
.hid{display:none}
a{color:var(--ac)}
@media(max-width:600px){header{padding:10px 12px}.logo span{display:none}main{padding:18px 14px 90px}}
/* ===== Liquid glass + bento ===== */
:root{--bg:#ece8f2;--card:rgba(255,255,255,.5);--gl2:rgba(246,243,252,.82);--tx:#1d1b26;--mu:#6f6b80;--bd:rgba(255,255,255,.75);--ac:#6c5ce7;--sh:inset 0 1px 0 rgba(255,255,255,.9),inset 0 -1px 0 rgba(255,255,255,.25),0 12px 32px rgba(90,70,160,.16);--g:radial-gradient(55% 45% at 12% 8%,#cbbcff 0,transparent 70%),radial-gradient(45% 45% at 92% 18%,#a6f0e4 0,transparent 70%),radial-gradient(60% 55% at 78% 98%,#ffcfc0 0,transparent 70%)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12111a;--card:rgba(255,255,255,.07);--gl2:rgba(28,26,40,.88);--tx:#f1eefb;--mu:#a29fb5;--bd:rgba(255,255,255,.14);--ac:#9b8cff;--sh:inset 0 1px 0 rgba(255,255,255,.18),0 12px 32px rgba(0,0,0,.45);--g:radial-gradient(55% 45% at 12% 8%,#4a3a9455 0,transparent 70%),radial-gradient(45% 45% at 92% 18%,#1f857a44 0,transparent 70%),radial-gradient(60% 55% at 78% 98%,#9a4a6a44 0,transparent 70%)}}
:root[data-theme="dark"]{--bg:#12111a;--card:rgba(255,255,255,.07);--gl2:rgba(28,26,40,.88);--tx:#f1eefb;--mu:#a29fb5;--bd:rgba(255,255,255,.14);--ac:#9b8cff;--sh:inset 0 1px 0 rgba(255,255,255,.18),0 12px 32px rgba(0,0,0,.45);--g:radial-gradient(55% 45% at 12% 8%,#4a3a9455 0,transparent 70%),radial-gradient(45% 45% at 92% 18%,#1f857a44 0,transparent 70%),radial-gradient(60% 55% at 78% 98%,#9a4a6a44 0,transparent 70%)}
body{background:var(--g),var(--bg);background-attachment:fixed;min-height:100vh}
h1{letter-spacing:-.02em;font-weight:800}
button,input,textarea,.box,.item,header{backdrop-filter:blur(18px) saturate(170%);-webkit-backdrop-filter:blur(18px) saturate(170%)}
button{border-radius:999px;padding:8px 16px;border-color:var(--bd);box-shadow:var(--sh);transition:transform .15s,border-color .15s}
button:active{transform:scale(.96)}
input,textarea{border-radius:22px;border-color:var(--bd);box-shadow:inset 0 2px 6px rgba(90,70,160,.08)}
header{margin:10px 14px 0;top:calc(env(safe-area-inset-top,0px) + 10px);border:1px solid var(--bd);border-radius:999px;background:var(--card);box-shadow:var(--sh);padding:8px 14px}
header input{border-radius:999px}
.pri{background:linear-gradient(135deg,#9a8cff,#5b5bd6);color:#fff;border-color:rgba(255,255,255,.45);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 10px 24px rgba(108,92,231,.45)}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.box,.item{background:var(--card);border-color:var(--bd);box-shadow:var(--sh)}
.box{border-radius:30px;padding:20px;display:flex;flex-direction:column;justify-content:flex-end}
.box:before{inset:auto -30px -50px auto;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,var(--c),transparent 68%);opacity:.5}
.box:hover{transform:translateY(-4px) scale(1.01)}
.bi{background:linear-gradient(145deg,rgba(255,255,255,.85),color-mix(in srgb,var(--c) 30%,transparent));box-shadow:inset 0 1px 0 #fff,0 6px 14px color-mix(in srgb,var(--c) 35%,transparent);margin-bottom:auto;position:relative}
.box b,.box span{position:relative}
.newbox{background:transparent;border:2px dashed var(--bd);align-items:center;justify-content:center;box-shadow:none}
.bento{grid-auto-flow:dense;grid-auto-rows:minmax(150px,auto)}
.bento .box:nth-child(6n+1){grid-column:span 2;grid-row:span 2}
.bento .box:nth-child(6n+4){grid-column:span 2}
.bento .box:nth-child(6n+1) .bi{width:68px;height:68px;font-size:36px}
.bento .box:nth-child(6n+1) b{font-size:26px;letter-spacing:-.02em}
.item{border-radius:26px}
.thumb{background:linear-gradient(135deg,color-mix(in srgb,var(--c,#888) 38%,transparent),color-mix(in srgb,var(--c,#888) 8%,transparent))}
.list .item{border-radius:22px}
.fav{backdrop-filter:blur(8px);background:rgba(255,255,255,.3)}
.tg{background:var(--card);border-color:var(--bd)}
.mb{background:rgba(40,25,80,.28);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.m{background:var(--gl2);border:1px solid var(--bd);border-radius:32px;box-shadow:var(--sh),0 30px 80px rgba(0,0,0,.25);backdrop-filter:blur(30px) saturate(180%)}
.sw{box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 4px 10px color-mix(in srgb,var(--c) 40%,transparent)}
.big{border-radius:22px}
@media(max-width:600px){header{margin:8px;padding:8px 12px}.grid{grid-template-columns:repeat(2,1fr)}.bento{grid-auto-rows:minmax(140px,auto)}.bento .box:nth-child(6n+4){grid-column:span 2}.box{border-radius:26px;padding:16px}}
/* ===== Melhorias para celular ===== */
@media (max-width: 600px) {
  header { margin: 8px; padding: 8px 12px; gap: 8px; }
  .logo { font-size: 16px; }
  .logo span { display: none; }
  header input { font-size: 15px; padding: 8px 12px; }
  main { padding: 16px 12px 100px; }
  h1 { font-size: 22px; }
  .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .bento { grid-auto-rows: minmax(130px, auto); }
  .bento .box:nth-child(6n+1) { grid-column: span 2; grid-row: span 2; }
  .bento .box:nth-child(6n+4) { grid-column: span 2; }
  .box { border-radius: 22px; padding: 14px; }
  .bi { width: 40px; height: 40px; font-size: 20px; }
  .item { border-radius: 18px; }
  .thumb { height: 110px; }
  .list .thumb { width: 56px; height: 56px; }
  .fab { right: 16px; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); padding: 14px 18px; font-size: 15px; }
  .m { border-radius: 24px; padding: 18px; max-height: 92vh; }
  .chips { gap: 6px; }
  .chip { padding: 6px 11px; font-size: 13px; }
}

/* Deixa os botões mais fáceis de tocar */
button, .chip, .box, .item {
  -webkit-tap-highlight-color: transparent;
}

/* Evita zoom automático no iPhone ao focar no input */
input, textarea, select {
  font-size: 16px !important;
}
.box:after,.item:after{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(240px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.38),transparent 60%);opacity:0;transition:opacity .25s;pointer-events:none}
.box:hover:after,.item:hover:after{opacity:1}
.box,.item{will-change:transform}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ===== Motion: liquid glass ===== */
.box,.item{transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .35s ease,border-color .3s ease}
.box .bi{transition:transform .4s cubic-bezier(.2,.9,.3,1.3)}
@media(hover:hover){
 .box:hover,.item:hover{transform:translateY(-4px) scale(1.012);box-shadow:var(--sh),0 20px 44px rgba(108,92,231,.22)}
 .box:hover .bi{transform:scale(1.1) rotate(-5deg)}
}
.pri{overflow:hidden}
.pri:not(.fab){position:relative}
.rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.5);transform:scale(0);animation:rip .55s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(1);opacity:0}}
@keyframes fabIn{from{opacity:0;transform:translateY(48px) scale(.9)}to{opacity:1;transform:none}}
.fab{animation:fabIn .6s .35s cubic-bezier(.2,.9,.3,1.15) backwards;transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s ease}
@media(hover:hover){.fab:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(108,92,231,.5),inset 0 1px 0 rgba(255,255,255,.55)}}
.fab:active{transform:scale(.94);transition-duration:.1s}
.theme-anim,.theme-anim *{transition:background-color .45s ease,color .45s ease,border-color .45s ease,box-shadow .45s ease!important}
::view-transition-old(root),::view-transition-new(root){animation-duration:.45s;animation-timing-function:cubic-bezier(.4,0,.2,1)}
/* ===== Pixel background + extra polish ===== */
#px{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
main{position:relative;z-index:1}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -5px}}
.box .bi{animation:bob 4.5s ease-in-out infinite}
.box:nth-child(2n) .bi{animation-delay:-1.2s}
.box:nth-child(3n) .bi{animation-delay:-2.4s}
.logo span{background:linear-gradient(90deg,var(--ac),#4fd1c5,#ff9a8b,var(--ac));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
@keyframes shine{to{background-position:-200% 0}}
.chip{transition:background .3s ease,color .3s ease,border-color .3s ease,transform .2s cubic-bezier(.2,.8,.2,1)}
.pri:after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);transform:translateX(-120%);transition:transform .7s cubic-bezier(.2,.8,.2,1);pointer-events:none}
@media(hover:hover){.chip:hover{transform:translateY(-2px)}.pri:hover:after{transform:translateX(120%)}}
/* ===== Polish v3: aurora, luz do cursor, detalhes ===== */
:root{--glow:rgba(255,255,255,.65)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--glow:rgba(140,120,255,.22)}}
:root[data-theme="dark"]{--glow:rgba(140,120,255,.22)}
#aurora{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
#aurora i{position:absolute;width:60vmax;height:60vmax;border-radius:50%;background:radial-gradient(circle,var(--a) 0,transparent 65%);opacity:.55;will-change:transform;animation:drift 26s ease-in-out infinite alternate}
#aurora i:nth-child(1){--a:#b9a8ff;left:-15vmax;top:-20vmax}
#aurora i:nth-child(2){--a:#8be9dc;right:-20vmax;top:5vmax;animation-duration:32s;animation-delay:-8s}
#aurora i:nth-child(3){--a:#ffc0ae;left:20vw;bottom:-30vmax;animation-duration:38s;animation-delay:-15s}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) #aurora i{opacity:.3}}
:root[data-theme="dark"] #aurora i{opacity:.3}
@keyframes drift{0%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(8vw,6vh,0) scale(1.15)}100%{transform:translate3d(-6vw,10vh,0) scale(.95)}}
#glow{position:fixed;left:0;top:0;width:440px;height:440px;margin:-220px 0 0 -220px;border-radius:50%;background:radial-gradient(circle,var(--glow),transparent 65%);pointer-events:none;z-index:0;opacity:0;transition:opacity .6s ease;will-change:transform}
header{transition:box-shadow .35s ease,transform .35s cubic-bezier(.2,.8,.2,1)}
header.sc{box-shadow:var(--sh),0 14px 34px rgba(90,70,160,.22);transform:scale(.985)}
.thumb img{transition:transform .8s cubic-bezier(.16,1,.3,1)}
@media(hover:hover){.item:hover .thumb img{transform:scale(1.08)}}
.fav{transition:color .25s ease,background .25s ease}
/* ===== Configurações ===== */
#wp{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0;transition:opacity .5s ease,filter .4s ease}
#wp.on{opacity:var(--wpo,1)}
#wp.blur{filter:blur(16px);transform:scale(1.1)}
html.hasWp #aurora{display:none}
.pri{background:linear-gradient(135deg,color-mix(in srgb,var(--ac) 68%,#fff),var(--ac));color:var(--onac,#fff);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 10px 24px color-mix(in srgb,var(--ac) 45%,transparent)}
.chip.on{color:var(--onac,#fff)}
body{font-size:calc(15px*var(--fs,1))}
.box b{font-size:calc(17px*var(--fs,1))}
h1{font-size:calc(26px*var(--fs,1))}
@media(max-width:600px){h1{font-size:calc(22px*var(--fs,1))}}
html[data-dens=compact] main{padding-top:14px}
html[data-dens=compact] .grid{gap:8px}html[data-dens=compact] .list{gap:5px}
html[data-dens=compact] .box{padding:14px}html[data-dens=compact] .ib{padding:6px 10px}html[data-dens=compact] .thumb{height:104px}
html[data-dens=spacious] main{padding-top:34px}
html[data-dens=spacious] .grid{gap:22px}html[data-dens=spacious] .list{gap:14px}
html[data-dens=spacious] .box{padding:26px}html[data-dens=spacious] .ib{padding:14px 16px}html[data-dens=spacious] .thumb{height:176px}
.noanim *,.noanim *:before,.noanim *:after{animation:none!important;transition:none!important}
.noanim #glow{display:none}
html.glass2{--card:rgba(255,255,255,.32);--bd:rgba(255,255,255,.95)}
@media(prefers-color-scheme:dark){html.glass2:not([data-theme="light"]){--card:rgba(255,255,255,.09);--bd:rgba(255,255,255,.3)}}
html.glass2[data-theme="dark"]{--card:rgba(255,255,255,.09);--bd:rgba(255,255,255,.3)}
html.glass2 .box,html.glass2 .item,html.glass2 header,html.glass2 button,html.glass2 input,html.glass2 textarea{backdrop-filter:blur(34px) saturate(210%);-webkit-backdrop-filter:blur(34px) saturate(210%)}
html.glass2 .m,html.glass2 .stp{backdrop-filter:blur(50px) saturate(210%);-webkit-backdrop-filter:blur(50px) saturate(210%);background:color-mix(in srgb,var(--gl2) 72%,transparent)}
#st{position:fixed;inset:0;z-index:15;pointer-events:none;visibility:hidden;transition:visibility 0s .45s}
#st.open{pointer-events:auto;visibility:visible;transition-delay:0s}
.stbg{position:absolute;inset:0}
.stp{position:absolute;top:0;right:0;bottom:0;width:min(440px,100%);display:flex;flex-direction:column;transform:translateX(105%);transition:transform .45s cubic-bezier(.16,1,.3,1);background:var(--gl2);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);border-left:1px solid var(--bd);border-radius:28px 0 0 28px;box-shadow:var(--sh),-20px 0 60px rgba(0,0,0,.2)}
#st.open .stp{transform:none}
.sth{display:flex;justify-content:space-between;align-items:center;padding:18px 20px 6px}
.sth h2{margin:0;font-size:20px}
.stb{overflow:auto;padding:6px 20px calc(28px + env(safe-area-inset-bottom,0px));flex:1}
.stb section{background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:16px;margin-top:14px;box-shadow:var(--sh)}
.stb h3{margin:0 0 10px;font-size:15px}
.stb label{display:block;font-size:13px;color:var(--mu);margin:12px 0 6px}
.cs-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.cs{width:34px;height:34px;padding:0;border-radius:50%;border:3px solid transparent;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.cs.on{border-color:var(--tx);transform:scale(1.1)}
.seg{display:flex;gap:4px;background:var(--bg);border-radius:999px;padding:4px}
.seg button{flex:1;border:0;box-shadow:none;background:transparent;padding:7px 6px;font-size:14px}
.seg button.on{background:var(--ac);color:var(--onac,#fff)}
.srow{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:12px}
.srow span{display:block;font-size:12px}
.tgl{width:52px;height:30px;padding:3px;border-radius:999px;flex:none}
.tgl i{display:block;width:22px;height:22px;border-radius:50%;background:var(--mu);transition:transform .3s cubic-bezier(.2,.9,.3,1.2),background .3s}
.tgl.on{background:var(--ac);border-color:var(--ac)}
.tgl.on i{transform:translateX(22px);background:#fff}
#wpPrev{position:relative;height:110px;border-radius:18px;overflow:hidden;background:var(--bg);border:1px solid var(--bd);display:grid;place-items:center}
#wpPrevIn{position:absolute;inset:-10px;transition:opacity .3s,filter .3s}
#wpPrev span{position:relative;font-size:13px;background:var(--card);padding:3px 12px;border-radius:99px;border:1px solid var(--bd)}
input[type=range]{padding:0;border:0;box-shadow:none;background:none;backdrop-filter:none;accent-color:var(--ac)}
input[type=color]{width:34px;height:34px;padding:0;border-radius:50%;border:2px solid var(--bd);cursor:pointer;background:none}
.cpk{display:inline-flex;margin:0!important}
@media(max-width:600px){.stp{width:100%;border-radius:0;border-left:0}}
/* ===== Layout mobile (app) ===== */
#msb,#bnav,.mbar,.mhome,.mrecw{display:none}
@media(max-width:600px){
 .fab{display:none!important}
 header{margin:8px 12px 0;padding:6px 8px 6px 16px;gap:4px}
 header #q,header [data-a=logout]{display:none}
 header .logo{flex:1;font-size:19px;letter-spacing:-.02em}
 .logo span{display:inline}
 header button{width:40px;height:40px;padding:0;border-radius:50%;font-size:18px}
 #msb{display:flex;align-items:center;gap:8px;margin:12px 12px 0;padding:0 18px;height:50px;border-radius:999px;background:var(--card);border:1px solid var(--bd);box-shadow:var(--sh);backdrop-filter:blur(18px) saturate(170%);-webkit-backdrop-filter:blur(18px) saturate(170%);position:relative;z-index:1}
 #msb input{border:0;background:transparent;box-shadow:none;backdrop-filter:none;padding:0;height:100%;flex:1}
 main{padding:14px 14px calc(124px + env(safe-area-inset-bottom,0px))}
 .toast{bottom:calc(104px + env(safe-area-inset-bottom,0px))}
 #main[data-view=home]>.row,#main[data-view=box]>.row{display:none}
 .mhome,.mrecw{display:block}
 .mbar{display:flex;align-items:center;gap:8px;margin:4px 0 12px}
 .mbar>button{width:42px;height:42px;padding:0;border-radius:50%;font-size:18px;flex:none}
 .mbar .mt{flex:1;display:flex;align-items:center;gap:10px;min-width:0}
 .mbar .mt>div{min-width:0}
 .mbar .mt b{display:block;font-size:20px;letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 .mbar .mt small,.mgreet small{color:var(--mu);font-size:13px}
 .mi{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;font-size:22px;background:color-mix(in srgb,var(--c) 24%,transparent);flex:none}
 .mgreet{display:flex;justify-content:space-between;align-items:center;margin:6px 2px 18px}
 .mgreet small{font-size:14px}
 .mgreet h1{font-size:32px;margin:0;line-height:1.1;letter-spacing:-.03em}
 .mav{width:48px;height:48px;padding:0;border:0;font-size:19px;font-weight:700;background:linear-gradient(135deg,color-mix(in srgb,var(--ac) 65%,#fff),var(--ac));color:var(--onac,#fff)}
 .mstats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
 .stat{background:var(--card);border:1px solid var(--bd);border-radius:24px;padding:14px;text-align:left;box-shadow:var(--sh);display:flex;flex-direction:column;gap:2px;align-items:flex-start}
 .stat span{font-size:20px}
 .stat b{font-size:28px;line-height:1.1;letter-spacing:-.03em}
 .stat small{color:var(--mu);font-size:12px}
 .msec{display:block;font-size:18px;margin:26px 2px 12px;letter-spacing:-.02em}
 .mqa{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
 .mqa button{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 2px 12px;border-radius:24px;font-size:12px;font-weight:600}
 .mqa i{font-style:normal;font-size:23px;width:46px;height:46px;border-radius:16px;display:grid;place-items:center;background:color-mix(in srgb,var(--ac) 16%,transparent)}
 #main .bento{grid-template-columns:repeat(2,1fr);gap:14px;grid-auto-rows:minmax(144px,auto)}
 #main .bento .box:nth-child(n){grid-column:auto;grid-row:auto}
 #main .bento .box .bi{width:48px;height:48px;font-size:24px;border-radius:16px}
 #main .bento .box b{font-size:calc(16px*var(--fs,1));letter-spacing:-.01em}
 .box{border-radius:26px}
 #main .chips{flex-wrap:nowrap;overflow-x:auto;margin:12px -14px 0;padding:2px 14px;scrollbar-width:none}
 #main .chips::-webkit-scrollbar{display:none}
 #main .chip{flex:none}
 #main .list{gap:10px;margin-top:14px}
 .list .item{padding:10px;gap:12px;border-radius:24px;align-items:center}
 .list .thumb{width:64px;height:64px;border-radius:17px;font-size:26px;flex:none}
 .list .ib{padding:0}
 .list .ib b{font-size:16px}
 .list .ib>span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 .list .fav{background:none;color:var(--mu);width:36px;height:36px;font-size:20px;flex:none}
 .item{border-radius:24px}
 #bnav{display:flex;position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));height:68px;z-index:12;align-items:center;padding:0 8px;border-radius:32px;background:var(--card);border:1px solid var(--bd);box-shadow:var(--sh),0 14px 34px rgba(0,0,0,.18);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%)}
 .bn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;background:none;border:0;box-shadow:none;backdrop-filter:none;padding:6px 0;font-size:11px;color:var(--mu);border-radius:18px}
 .bn i{font-style:normal;font-size:21px;line-height:1.1}
 .bn.on{color:var(--ac);font-weight:600}
 .bn.add{flex:none;width:60px;height:60px;margin:-30px 6px 0;border-radius:50%;background:linear-gradient(135deg,color-mix(in srgb,var(--ac) 68%,#fff),var(--ac));color:var(--onac,#fff);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 12px 26px color-mix(in srgb,var(--ac) 50%,transparent);border:3px solid var(--bg)}
 .bn.add i{font-size:30px;font-weight:300}
 .bn:active{transform:scale(.92)}
}
/* ===== Modo leve no celular (desempenho) ===== */
@media(max-width:600px){
 :root{--card:rgba(255,255,255,.72)}
 button,.box,.item,input,textarea{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
 header,#msb,#bnav{backdrop-filter:blur(12px) saturate(140%);-webkit-backdrop-filter:blur(12px) saturate(140%)}
 #aurora i{animation:none;will-change:auto}
 .box,.item{will-change:auto}
 .box .bi,.logo span{animation:none}
}
@media(max-width:600px) and (prefers-color-scheme:dark){:root:not([data-theme="light"]){--card:rgba(255,255,255,.1)}}
@media(max-width:600px){:root[data-theme="dark"]{--card:rgba(255,255,255,.1)}}
/* ===== Desligar efeito de vidro (opção nas configurações) ===== */
html.noglass *{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
html.noglass{--card:rgba(255,255,255,.78)}
@media(prefers-color-scheme:dark){html.noglass:not([data-theme="light"]){--card:rgba(255,255,255,.11)}}
html.noglass[data-theme="dark"]{--card:rgba(255,255,255,.11)}
html.noglass .m,html.noglass .stp{background:var(--bg)}
</style>

<body>
<header>
<div class="logo" data-a="home">🗄️ Meu <span>Vault</span></div>
<input id="q" placeholder="Buscar em tudo…" autocomplete="off">
<button data-a="settings" title="Configurações">⚙️</button><button data-a="theme" title="Tema">🌓</button><button data-a="logout" title="Sair">⎋</button>
</header>
<main id="main"></main>
<button class="pri fab" data-a="quick">＋ Adicionar rápido</button>
<div id="modal"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const $=s=>document.querySelector(s);
const COLORS=['#5b5bd6','#e5484d','#f76b15','#e5a50a','#30a46c','#0091ff','#d6409f','#8e8c99'];
const ICONS=['📁','🔗','📸','🎬','💡','📄','🧠','✈️','🎵','⭐','🍳','📚','🏠','💼','🎮','❤️'];
const TYPES={link:['🔗','Link'],note:['📝','Nota'],photo:['🖼️','Foto'],video:['🎬','Vídeo'],file:['📄','Arquivo'],audio:['🎵','Áudio']};
const SUG=['Links para assistir','Fotos da viagem','Vídeos importantes','Ideias e referências','Documentos','Memórias'];
let S={boxes:[]};
let route=null,q='',filt='all',view='grid',tagf=null,unlocked={},dragId=null;
const uid=()=>crypto.randomUUID();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){queueSync()}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);d.animate([{opacity:0,transform:'translate(-50%,20px) scale(.9)'},{opacity:1,transform:'translate(-50%,0) scale(1)'}],{duration:300,easing:'cubic-bezier(.2,.9,.3,1.3)'});setTimeout(()=>{d.animate([{opacity:1},{opacity:0}],{duration:250,fill:'forwards'}).onfinish=()=>d.remove()},2000)}
const box=id=>S.boxes.find(b=>b.id===id);
const host=u=>{try{return new URL(u).hostname.replace('www.','')}catch(e){return u||''}};
const ytId=u=>(u.match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/)||[])[1];
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
function modal(h){$('#modal').innerHTML=h?`<div class="mb"><div class="m">${h}</div></div>`:'';
 if(h&&!matchMedia('(prefers-reduced-motion:reduce)').matches){document.querySelector('.mb').animate([{opacity:0},{opacity:1}],{duration:220});document.querySelector('.m').animate([{opacity:0,transform:'translateY(30px) scale(.94)'},{opacity:1,transform:'none'}],{duration:380,easing:'cubic-bezier(.2,.9,.3,1.2)'})}}
const tagsOf=t=>t.split(',').map(x=>x.trim().toLowerCase()).filter(Boolean);
const matches=i=>!q||[i.title,i.text,i.url,(i.tags||[]).join(' ')].join(' ').toLowerCase().includes(q.toLowerCase());

function card(i,b,drag){
 const c=b.color;let th;
 if(i.type==='photo'&&(i.data||i.url))th=`<img src="${esc(i.data||i.url)}" alt="" loading="lazy">`;
 else th=TYPES[i.type][0];
 const sub=i.type==='note'?esc((i.text||'').slice(0,70)):esc(host(i.url)||i.fname||'');
 return `<div class="item" style="--c:${c}" data-a="open" data-id="${i.id}" data-b="${b.id}" ${drag?'draggable="true"':''}>
 <div class="thumb">${th}</div><div class="ib"><b>${esc(i.title||'Sem título')}</b><span class="mu" style="font-size:13px">${sub}</span><div>${(i.tags||[]).map(t=>`<span class="tg" data-a="tag" data-t="${esc(t)}">#${esc(t)}</span>`).join('')}</div></div>
 <button class="fav ${i.fav?'on':''}" data-a="fav" data-id="${i.id}" data-b="${b.id}">★</button></div>`;
}
function typeChips(items){
 return `<div class="chips">${['all',...Object.keys(TYPES),'fav'].map(t=>`<button class="chip ${filt===t?'on':''}" data-a="filt" data-t="${t}">${t==='all'?'Tudo':t==='fav'?'★ Favoritos':TYPES[t][0]+' '+TYPES[t][1]}</button>`).join('')}</div>`+(tagf?`<div class="chips"><button class="chip on" data-a="tag" data-t="">#${esc(tagf)} ✕</button></div>`:'');
}
const passF=i=>(filt==='all'||(filt==='fav'?i.fav:i.type===filt))&&(!tagf||(i.tags||[]).includes(tagf))&&matches(i);

function render(){
 const m=$('#main');
 if(q&&!route){
  const r=[];S.boxes.forEach(b=>{if(b.pass)return;b.items.filter(matches).forEach(i=>r.push(card(i,b)))});
  m.innerHTML=`<h1>Resultados</h1><p class="mu">${r.length} item(ns) (caixas com senha ficam fora da busca global)</p><div class="grid">${r.join('')}</div>`;return;
 }
 if(route){
  const b=box(route);if(!b){route=null;return render()}
  if(b.pass&&!unlocked[b.id]){m.innerHTML=`<div class="empty"><div style="font-size:48px">🔒</div><h2>${esc(b.name)}</h2><p>Esta caixa tem senha.</p><div style="max-width:260px;margin:auto"><input id="pw" type="password" placeholder="Senha"><br><br><button class="pri" data-a="unlock" data-b="${b.id}">Abrir</button></div></div>`;return}
  const items=b.items.filter(passF);const can=!q&&filt==='all'&&!tagf&&view==='grid'||false;
  m.innerHTML=`<div class="row"><button data-a="home">← Caixas</button><div class="sp"></div><button data-a="view">${view==='grid'?'☰ Lista':'▦ Grade'}</button><button data-a="share">🔗 Compartilhar</button><button data-a="editbox">✏️ Editar</button></div>
  <div class="row" style="margin-top:18px"><div class="bi" style="--c:${b.color};margin:0">${b.icon}</div><div><h1>${esc(b.name)}${b.pass?' 🔒':''}</h1><span class="mu">${b.items.length} itens</span></div></div>
  <div class="row" style="margin-top:14px"><button class="pri" data-a="additem">＋ Novo item</button></div>${typeChips()}
  ${items.length?`<div class="${view}" id="items">${items.map(i=>card(i,b,can)).join('')}</div>`:`<div class="empty"><div style="font-size:44px">📭</div><p>${b.items.length?'Nada encontrado com esses filtros.':'Caixa vazia. Adicione links, fotos, notas, vídeos…'}</p></div>`}`;
  const s=$('#q');return;
 }
 m.innerHTML=`<div class="row"><div><h1>Minhas caixas</h1><span class="mu">Seu espaço pessoal organizado.</span></div><div class="sp"></div><button class="pri" data-a="newbox" style="padding:12px 20px;font-size:16px">＋ Criar nova caixa</button></div>
 ${S.boxes.length?'':`<div class="empty"><div style="font-size:54px">🗄️</div><h2 style="color:var(--tx)">Bem-vindo ao seu Vault</h2><p>Crie sua primeira caixa — ou comece com uma sugestão:</p><div class="row" style="justify-content:center">${SUG.map(s=>`<button class="chip" data-a="sug" data-n="${s}">${s}</button>`).join('')}</div></div>`}
 <div class="grid bento">${S.boxes.map(b=>`<div class="box" style="--c:${b.color}" data-a="go" data-b="${b.id}"><div class="bi">${b.icon}</div><b>${esc(b.name)}${b.pass?' 🔒':''}</b><span class="mu">${b.items.length} itens</span></div>`).join('')}
 ${S.boxes.length?`<div class="box newbox" data-a="newbox"><div>＋<br>Nova caixa</div></div>`:''}</div>`;
}

function boxForm(b){
 b=b||{name:'',color:COLORS[0],icon:ICONS[0]};
 modal(`<h2>${b.id?'Editar caixa':'Nova caixa'}</h2><label>Nome</label><input id="bn" value="${esc(b.name)}" placeholder="Ex.: Fotos da viagem">
 <label>Ícone</label><div class="row">${ICONS.map(i=>`<button class="ic ${i===b.icon?'sel':''}" data-a="pick" data-k="ic" data-v="${i}">${i}</button>`).join('')}</div>
 <label>Cor</label><div class="row">${COLORS.map(c=>`<button class="sw ${c===b.color?'sel':''}" style="--c:${c}" data-a="pick" data-k="sw" data-v="${c}"></button>`).join('')}</div>
 <label>Senha (opcional)${b.pass?' — deixe vazio para manter; digite "-" para remover':''}</label><input id="bp" type="password" placeholder="Sem senha">
 <div class="row" style="margin-top:20px">${b.id?`<button data-a="delbox" data-b="${b.id}" style="color:#e5484d">Excluir</button>`:''}<div class="sp"></div><button data-a="close">Cancelar</button><button class="pri" data-a="savebox" data-b="${b.id||''}">Salvar</button></div>`);
 setTimeout(()=>$('#bn')&&$('#bn').focus(),50);
}
function itemForm(bid,pre){
 pre=pre||{};const t=pre.type||'link';
 modal(`<h2>Novo item</h2><div class="row">${Object.entries(TYPES).map(([k,v])=>`<button class="chip ${k===t?'on':''}" data-a="itype" data-t="${k}">${v[0]} ${v[1]}</button>`).join('')}</div>
 <input type="hidden" id="it" value="${t}">
 <label>Caixa</label><div class="row" id="bsel">${S.boxes.map(b=>`<button class="chip ${b.id===bid?'on':''}" data-a="pickbox" data-b="${b.id}">${b.icon} ${esc(b.name)}</button>`).join('')}</div>
 <label>Título</label><input id="ti" placeholder="Opcional">
 <div id="f-url"><label>Link / URL</label><input id="iu" value="${esc(pre.url||'')}" placeholder="https://…"></div>
 <div id="f-text"><label>Texto</label><textarea id="ix" rows="5"></textarea></div>
 <div id="f-file"><label>Arquivo do dispositivo</label><input id="if" type="file"></div>
 <label>Tags (separe por vírgula)</label><input id="ig" placeholder="viagem, ideia">
 <div class="row" style="margin-top:20px"><div class="sp"></div><button data-a="close">Cancelar</button><button class="pri" data-a="saveitem">Adicionar</button></div>`);
 modal.bid=bid;setType(t);
}
function setType(t){
 $('#it').value=t;
 document.querySelectorAll('[data-a=itype]').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
 $('#f-url').classList.toggle('hid',t==='note'||t==='file');
 $('#f-text').classList.toggle('hid',!['note','link','video','photo'].includes(t)||false);
 $('#f-file').classList.toggle('hid',!['photo','file','audio','video'].includes(t));
 $('#f-url').classList.toggle('hid',t==='note'||t==='file');
}
function detect(u){return /\.(png|jpe?g|gif|webp|avif|svg)(\?|$)/i.test(u)?'photo':/youtu|vimeo|\.mp4|\.webm/i.test(u)?'video':/^https?:/i.test(u)?'link':'note'}
function readFile(f,max){return new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f)})}
async function photoData(f){const u=await readFile(f);return new Promise(r=>{const im=new Image();im.onload=()=>{const k=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.75))};im.onerror=()=>r(u);im.src=u})}

function detail(bid,id){
 const b=box(bid),i=b.items.find(x=>x.id===id);if(!i)return;
 let med='';
 if(i.type==='photo')med=`<img class="big" src="${esc(i.data||i.url)}" alt="">`;
 else if(i.type==='video'){const y=ytId(i.url||'');med=y?`<iframe class="big" style="width:100%;aspect-ratio:16/9;border:0" src="https://www.youtube-nocookie.com/embed/${y}" allowfullscreen></iframe>`:i.data?`<video class="big" controls src="${i.data}"></video>`:''}
 else if(i.type==='audio'&&i.data)med=`<audio controls src="${i.data}" style="width:100%"></audio>`;
 modal(`<h2>${TYPES[i.type][0]} ${esc(i.title||'Sem título')}</h2>${med}
 ${i.url?`<p><a href="${esc(i.url)}" target="_blank" rel="noopener noreferrer">${esc(i.url)}</a></p>`:''}
 ${i.text?`<p style="white-space:pre-wrap">${esc(i.text)}</p>`:''}
 ${i.data&&i.type==='file'?`<p><a href="${i.data}" download="${esc(i.fname)}">⬇ ${esc(i.fname)}</a></p>`:i.fname&&i.type==='file'?`<p class="mu">📄 ${esc(i.fname)} (arquivo grande: só o nome foi salvo)</p>`:''}
 <label>Título</label><input id="ti" value="${esc(i.title)}"><label>Tags</label><input id="ig" value="${esc((i.tags||[]).join(', '))}">
 <p class="mu" style="font-size:12px">Adicionado em ${new Date(i.ts).toLocaleString('pt-BR')}</p>
 <div class="row"><button data-a="delitem" data-id="${id}" data-b="${bid}" style="color:#e5484d">Excluir</button><div class="sp"></div><button data-a="close">Fechar</button><button class="pri" data-a="upditem" data-id="${id}" data-b="${bid}">Salvar</button></div>`);
}
function shareLink(b){
 const c={name:b.name,color:b.color,icon:b.icon,items:b.items.map(i=>({type:i.type==='file'||i.type==='audio'?'note':i.type,title:i.title,url:i.url,text:i.text,tags:i.tags,ts:i.ts,data:i.data&&i.data.length<2000?i.data:undefined}))};
 return location.href.split('#')[0]+'#s='+btoa(unescape(encodeURIComponent(JSON.stringify(c))));
}
function checkShared(){
 if(!location.hash.startsWith('#s='))return;
 try{const c=JSON.parse(decodeURIComponent(escape(atob(location.hash.slice(3)))));window._sh=c;
  modal(`<h2>📥 Caixa compartilhada</h2><p><b>${c.icon} ${esc(c.name)}</b> — ${c.items.length} itens (fotos enviadas e arquivos não vão no link).</p><div class="row"><div class="sp"></div><button data-a="close">Ignorar</button><button class="pri" data-a="import">Adicionar ao meu Vault</button></div>`)}catch(e){}
}

document.addEventListener('click',async e=>{
 if(e.target.classList.contains('mb'))return modal('');
 const t=e.target.closest('[data-a]');if(!t)return;
 const a=t.dataset.a,d=t.dataset;
 if(a==='fav'){e.stopPropagation();const i=box(d.b).items.find(x=>x.id===d.id);i.fav=!i.fav;save();render();popFav(d.id);return}
 if(a==='tag'){e.stopPropagation();tagf=d.t||null;return render()}

(function(){return; /* fundo de pixels desativado */

async function sync(){

   for(const [ii,i] of b.items.entries()){
    if(i.data&&i.data.startsWith('data:')&&!i.file_path){
     const blob=await (await fetch(i.data)).blob(),path=user.id+'/'+i.id;
     const up=await bkt().upload(path,blob,{upsert:true,contentType:blob.type||undefined});

  let e;
  if(bu.length&&(e=(await sb.from('boxes').upsert(bu)).error))throw e;

const PDEF={wp:{type:'none',v:'',img:''},wpOp:100,wpBlur:false,theme:'auto',accent:'#6c5ce7',dens:'normal',font:'normal',anim:true,glass:false,noglass:false};

try{const x=JSON.parse(localStorage.getItem('mv_prefs'));if(x)P={...P,...x,wp:{...P.wp,...(x.wp||{})}}}catch(e){}
function saveP(){try{localStorage.setItem('mv_prefs',JSON.stringify(P));return true}catch(e){toast('Sem espaço para salvar (imagem muito grande)');return false}}
const WPC=['#f5f1ea','#e4ebf7','#f3e3ec','#e1f0e8','#2b2d42','#1b1b2f','#0f172a','#3a1c35'];
const GR=['linear-gradient(135deg,#a18cd1,#fbc2eb)','linear-gradient(135deg,#84fab0,#8fd3f4)','linear-gradient(135deg,#ff9a9e,#fecfef)','linear-gradient(135deg,#f6d365,#fda085)','linear-gradient(135deg,#667eea,#764ba2)','linear-gradient(135deg,#0f2027,#203a43,#2c5364)','linear-gradient(135deg,#232526,#414345)','linear-gradient(135deg,#ff0844,#ffb199)','radial-gradient(circle at 20% 20%,#ffd3a5,transparent 50%),radial-gradient(circle at 80% 30%,#a6c0fe,transparent 50%),radial-gradient(circle at 50% 90%,#f68084,transparent 55%),#fdfbfb','radial-gradient(circle at 30% 20%,#4b6cb7,transparent 55%),radial-gradient(circle at 80% 80%,#b24592,transparent 55%),#0b1020'];
const ACS=['#6c5ce7','#0091ff','#00b8a9','#30a46c','#e5a50a','#f76b15','#e5484d','#d6409f','#8e8c99','#1d1b26'];
const root=document.documentElement,wpEl=document.createElement('div');wpEl.id='wp';document.body.prepend(wpEl);
const wpCss=()=>{const w=P.wp;return w.type==='color'?w.v:w.type==='grad'?GR[+w.v]:(w.type==='img'&&w.img)?'url("'+w.img+'") center/cover no-repeat':''};
function markSel(){
 if(!stEl)return;
 stEl.querySelectorAll('[data-pk]').forEach(b=>b.classList.toggle('on',String(P[b.dataset.pk])===b.dataset.pv));
 stEl.querySelectorAll('[data-ptg]').forEach(b=>{const k=b.dataset.ptg;b.classList.toggle('on',k==='anim'?P.anim!==false:!!P[k])});
 const w=P.wp,cur=w.type==='color'?'c:'+w.v:w.type==='grad'?'g:'+w.v:'';
 stEl.querySelectorAll('[data-pwp]').forEach(b=>b.classList.toggle('on',b.dataset.pwp===cur));
 stEl.querySelectorAll('[data-pac]').forEach(b=>b.classList.toggle('on',b.dataset.pac===P.accent));
 $('#acc').value=P.accent;$('#wpo').value=P.wpOp;$('#wpov').textContent=P.wpOp+'%';
 const css=wpCss(),pi=$('#wpPrevIn');pi.style.background=css;pi.style.opacity=P.wpOp/100;pi.style.filter=P.wpBlur?'blur(6px)':'none';
 $('#wpPrev span').textContent=css?'Prévia':'Padrão (sem papel de parede)';
}
function applyP(){
 if(P.theme==='auto')delete root.dataset.theme;else root.dataset.theme=P.theme;
 const css=wpCss();wpEl.style.background=css;wpEl.classList.toggle('on',!!css);wpEl.classList.toggle('blur',!!P.wpBlur);wpEl.style.setProperty('--wpo',P.wpOp/100);root.classList.toggle('hasWp',!!css);
 if(String(P.accent).toLowerCase()===PDEF.accent){root.style.removeProperty('--ac');root.style.removeProperty('--onac')}
 else{root.style.setProperty('--ac',P.accent);const n=parseInt(P.accent.slice(1),16),l=(.299*(n>>16)+.587*(n>>8&255)+.114*(n&255))/255;root.style.setProperty('--onac',l>.65?'#1d1b26':'#fff')}
 root.dataset.dens=P.dens;root.dataset.font=P.font;root.style.setProperty('--fs',{sm:.9,normal:1,lg:1.12}[P.font]||1);
 root.classList.toggle('noanim',P.anim===false);root.classList.toggle('glass2',!!P.glass);root.classList.toggle('noglass',!!P.noglass);
 markSel();
}
/* tema (botão do topo e configurações) */
function setTheme(t,anim){
 P.theme=t;saveP();
 if(anim&&P.anim!==false&&!RM&&document.startViewTransition)document.startViewTransition(applyP);else applyP();
}
toggleTheme=function(){const dk=root.dataset.theme?root.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;setTheme(dk?'light':'dark',true)};
/* animações desligadas: zera as animações em JS */
const _an=Element.prototype.animate;
Element.prototype.animate=function(k,o){if(P.anim===false)o=Object.assign({},typeof o==='number'?{duration:o}:o,{duration:0,delay:0});if(Array.isArray(k)&&matchMedia('(max-width:600px)').matches)k=k.map(f=>{const g={...f};delete g.filter;return g});return _an.call(this,k,o)};
/* painel */
const seg=(k,opts)=>'<div class="seg">'+opts.map(o=>'<button data-pk="'+k+'" data-pv="'+o[0]+'">'+o[1]+'</button>').join('')+'</div>';
const tgl=(k,t,d)=>'<div class="srow"><div><b>'+t+'</b><span class="mu">'+d+'</span></div><button class="tgl" data-ptg="'+k+'" role="switch"><i></i></button></div>';
function buildSt(){
 stEl=document.createElement('div');stEl.id='st';
 stEl.innerHTML='<div class="stbg" data-do="close"></div><aside class="stp"><div class="sth"><h2>⚙️ Configurações</h2><button data-do="close">✕</button></div><div class="stb">'
 +'<section><h3>🖼️ Papel de parede</h3><div id="wpPrev"><div id="wpPrevIn"></div><span></span></div>'
 +'<label>Cores sólidas</label><div class="cs-row">'+WPC.map(c=>'<button class="cs" style="background:'+c+'" data-pwp="c:'+c+'"></button>').join('')+'</div>'
 +'<label>Gradientes</label><div class="cs-row">'+GR.map((g,i)=>'<button class="cs" style="background:'+g+'" data-pwp="g:'+i+'"></button>').join('')+'</div>'
 +'<div class="row" style="margin-top:14px"><button data-do="wpimg">📷 Enviar imagem…</button><button data-do="wprm">Remover papel de parede</button></div><input type="file" id="wpf" accept="image/*" class="hid">'
 +'<label>Intensidade <b id="wpov"></b></label><input type="range" id="wpo" min="10" max="100">'
 +tgl('wpBlur','Desfocar fundo','Aplica blur ao papel de parede')+'</section>'
 +'<section><h3>🌓 Tema</h3>'+seg('theme',[['light','☀️ Claro'],['dark','🌙 Escuro'],['auto','🖥️ Auto']])+'</section>'
 +'<section><h3>🎨 Cor de destaque</h3><div class="cs-row">'+ACS.map(c=>'<button class="cs" style="background:'+c+'" data-pac="'+c+'"></button>').join('')+'<label class="cpk" title="Cor personalizada"><input type="color" id="acc"></label></div></section>'
 +'<section><h3>✨ Personalização</h3><label>Densidade</label>'+seg('dens',[['compact','Compacta'],['normal','Normal'],['spacious','Espaçada']])+'<label>Tamanho da fonte</label>'+seg('font',[['sm','Pequeno'],['normal','Normal'],['lg','Grande']])
 +tgl('anim','Animações','Movimentos e transições')+tgl('glass','Vidro intenso','Glassmorphism mais forte')+tgl('noglass','Desligar efeito de vidro','Mais leve e rápido (bom para celulares lentos)')+'</section>'
 +'<section><h3>💾 Dados</h3><div class="row"><button data-do="export">⬇ Exportar backup</button><button data-do="import">⬆ Importar backup</button></div><input type="file" id="bkf" accept="application/json,.json" class="hid">'
 +'<div class="row" style="margin-top:10px"><button data-do="resetp">Restaurar aparência</button><button data-do="clear" style="color:#e5484d">🗑 Limpar todos os dados</button></div><p class="mu" style="font-size:12px;margin:12px 0 0">As preferências ficam salvas neste aparelho e também vão dentro do backup.</p></section><section><h3>👤 Conta</h3><button data-a="logout">Sair da conta</button></section></div></aside>';
 document.body.appendChild(stEl);
}
function openSt(){if(!stEl)buildSt();markSel();requestAnimationFrame(()=>stEl.classList.add('open'))}
function closeSt(){stEl&&stEl.classList.remove('open')}
/* backup */
const blobData=b=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(b)});
async function exportBackup(){
 toast('Preparando backup…');const boxes=[];
 for(const b of S.boxes){const items=[];
  for(const i of b.items){const o={id:i.id,type:i.type,title:i.title,url:i.url,text:i.text,tags:i.tags,fav:i.fav,fname:i.fname,ts:i.ts};
   if(i.data){if(i.data.startsWith('data:'))o.data=i.data;else{try{const bl=await (await fetch(i.data)).blob();if(bl.size<8e6)o.data=await blobData(bl)}catch(e){}}}
   items.push(o)}
  boxes.push({id:b.id,name:b.name,color:b.color,icon:b.icon,pass:b.pass,items});
 }
 const blob=new Blob([JSON.stringify({app:'meu-vault',version:2,exported:new Date().toISOString(),prefs:P,boxes})],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='meu-vault-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast('Backup exportado');
}
async function importBackup(f){
 try{
  const d=JSON.parse(await f.text());if(!Array.isArray(d.boxes))throw 0;
  const U=x=>/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(x||'')?x:uid();
  if(!confirm('Importar '+d.boxes.length+' caixa(s)? Caixas com o mesmo ID serão substituídas.'))return;
  d.boxes.forEach(b=>{
   const nb={id:U(b.id),name:b.name||'Caixa',color:b.color||'#5b5bd6',icon:b.icon||'📁',pass:b.pass||undefined,items:(b.items||[]).map(i=>({...i,id:U(i.id),tags:i.tags||[],ts:i.ts||Date.now(),file_path:undefined}))};
   const k=S.boxes.findIndex(x=>x.id===nb.id);if(k>=0)S.boxes[k]=nb;else S.boxes.push(nb);
  });
  if(d.prefs){P={...PDEF,...d.prefs,wp:{...PDEF.wp,...(d.prefs.wp||{})}};saveP();applyP()}
  route=null;save();render();toast('Backup importado');
 }catch(e){toast('Arquivo de backup inválido')}
}
const wpFromFile=f=>new Promise(res=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1920/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.82))};im.onerror=()=>res(null);im.src=fr.result};fr.readAsDataURL(f)});
/* eventos */
document.addEventListener('click',async e=>{
 const t=e.target.closest('[data-a=settings],[data-do],[data-pk],[data-ptg],[data-pwp],[data-pac]');if(!t)return;
 const d=t.dataset;
 if(d.a==='settings')return openSt();
 if(d.pk){if(d.pk==='theme')setTheme(d.pv,true);else{P[d.pk]=d.pv;applyP();saveP()}return}
 if(d.ptg){P[d.ptg]=d.ptg==='anim'?P.anim===false:!P[d.ptg];applyP();saveP();return}
 if(d.pwp){P.wp={...P.wp,type:d.pwp[0]==='c'?'color':'grad',v:d.pwp.slice(2)};applyP();saveP();return}
 if(d.pac){P.accent=d.pac;applyP();saveP();return}
 const a=d.do;
 if(a==='close')closeSt();
 else if(a==='wpimg')$('#wpf').click();
 else if(a==='wprm'){P.wp={type:'none',v:'',img:''};applyP();saveP()}
 else if(a==='export')exportBackup();
 else if(a==='import')$('#bkf').click();
 else if(a==='resetp'){P=JSON.parse(JSON.stringify(PDEF));applyP();saveP();toast('Aparência restaurada')}
 else if(a==='clear')modal('<h2>🗑 Limpar todos os dados</h2><p>Isso apaga <b>todas as caixas, itens, fotos e arquivos</b> da sua conta e não pode ser desfeito. Exporte um backup antes.</p><label>Digite <b>APAGAR</b> para confirmar</label><input id="cf" autocomplete="off"><div class="row" style="margin-top:18px"><div class="sp"></div><button data-a="close">Cancelar</button><button class="pri" data-do="clearok" style="background:#e5484d;border-color:#e5484d">Apagar tudo</button></div>');
 else if(a==='clearok'){
  if($('#cf').value.trim().toUpperCase()!=='APAGAR')return toast('Digite APAGAR para confirmar');
  S.boxes=[];route=null;save();modal('');render();toast('Todos os dados foram apagados');
 }
});
document.addEventListener('input',e=>{
 if(e.target.id==='wpo'){P.wpOp=+e.target.value;applyP();clearTimeout(pt);pt=setTimeout(saveP,250)}
 if(e.target.id==='acc'){P.accent=e.target.value;applyP();clearTimeout(pt);pt=setTimeout(saveP,250)}
});
document.addEventListener('change',async e=>{
 const f=e.target.files&&e.target.files[0];if(!f)return;
 if(e.target.id==='wpf'){
  const url=await wpFromFile(f);e.target.value='';if(!url)return toast('Imagem inválida');
  const old=P.wp;P.wp={type:'img',v:'',img:url};if(!saveP())P.wp=old;applyP();
 }
 if(e.target.id==='bkf'){e.target.value='';importBackup(f)}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSt()});
/* ===== Layout mobile (app) ===== */
let favMode=false;
if(matchMedia('(max-width:600px)').matches)view='list';
const msb=document.createElement('div');msb.id='msb';
msb.innerHTML='<span>🔍</span><input id="q2" type="search" placeholder="Buscar caixas, links, notas…" autocomplete="off">';
document.querySelector('main').before(msb);
$('#q2').addEventListener('input',e=>{const q1=$('#q');q1.value=e.target.value;q1.dispatchEvent(new Event('input',{bubbles:true}))});
const bn=document.createElement('nav');bn.id='bnav';
bn.innerHTML='<button class="bn" data-m="home"><i>🏠</i>Início</button><button class="bn" data-m="favs"><i>★</i>Favoritos</button><button class="bn add" data-a="quick" aria-label="Adicionar"><i>＋</i></button><button class="bn" data-m="search"><i>🔍</i>Buscar</button><button class="bn" data-a="settings"><i>⚙️</i>Ajustes</button>';
document.body.appendChild(bn);
const hi=()=>{const h=new Date().getHours();return h<5?'Boa madrugada':h<12?'Bom dia':h<18?'Boa tarde':'Boa noite'};
const _rmob=render;
render=function(){
 const same=(route+'|'+view+'|'+filt+'|'+tagf+'|'+!!q)===lastKey;
 if(route)favMode=false;
 _rmob();
 const m=$('#main'),ws=!route&&!q,q2=$('#q2');
 m.dataset.view=route?'box':q?'search':favMode?'favs':'home';
 if(document.activeElement!==q2)q2.value=q;
 if(route){
  const b=box(route);
  if(b){const lock=b.pass&&!unlocked[b.id];
   m.insertAdjacentHTML('afterbegin','<div class="mbar"><button data-a="home" aria-label="Voltar">‹</button><div class="mt"><span class="mi" style="--c:'+esc(b.color)+'">'+esc(b.icon)+'</span><div><b>'+esc(b.name)+'</b><small>'+(lock?'Caixa protegida':b.items.length+' itens')+'</small></div></div>'+(lock?'':'<button data-a="view" aria-label="Alternar visualização">'+(view==='grid'?'☰':'▦')+'</button><button data-a="share" aria-label="Compartilhar">🔗</button><button data-a="editbox" aria-label="Editar">✏️</button>')+'</div>')}
 }else if(favMode&&ws){
  const r=[];S.boxes.forEach(b=>{if(b.pass&&!unlocked[b.id])return;b.items.filter(i=>i.fav).forEach(i=>r.push(card(i,b)))});
  m.innerHTML='<div class="mbar"><button data-m="home" aria-label="Voltar">‹</button><div class="mt"><span class="mi" style="--c:#e5a50a">★</span><div><b>Favoritos</b><small>'+r.length+' itens</small></div></div></div>'+(r.length?'<div class="list">'+r.join('')+'</div>':'<div class="empty"><div style="font-size:44px">⭐</div><p>Nenhum favorito ainda. Toque na estrela de um item para marcá-lo.</p></div>');
 }else if(ws){
  const nb=S.boxes.length,ni=S.boxes.reduce((a,b)=>a+b.items.length,0),nf=S.boxes.reduce((a,b)=>a+b.items.filter(i=>i.fav).length,0),ini=((user&&user.email)||'V')[0].toUpperCase();
  m.insertAdjacentHTML('afterbegin','<div class="mhome"><div class="mgreet"><div><small>'+hi()+' 👋</small><h1>Seu Vault</h1></div><button class="mav" data-a="settings" aria-label="Configurações">'+esc(ini)+'</button></div>'
   +'<div class="mstats"><div class="stat"><span>🗂️</span><b>'+nb+'</b><small>Caixas</small></div><div class="stat"><span>📦</span><b>'+ni+'</b><small>Itens</small></div><button class="stat" data-m="favs"><span>⭐</span><b>'+nf+'</b><small>Favoritos</small></button></div>'
   +'<h3 class="msec">Acesso rápido</h3><div class="mqa"><button data-m="link"><i>🔗</i>Link</button><button data-m="photo"><i>🖼️</i>Foto</button><button data-m="box"><i>📁</i>Nova caixa</button><button data-m="favs"><i>⭐</i>Favoritos</button></div>'
   +(nb?'<h3 class="msec">Minhas caixas</h3>':'')+'</div>');
  const rec=[];S.boxes.forEach(b=>{if(b.pass)return;b.items.forEach(i=>rec.push([i,b]))});
  rec.sort((a,b)=>(b[0].ts||0)-(a[0].ts||0));
  if(rec.length)m.insertAdjacentHTML('beforeend','<div class="mrecw"><h3 class="msec">Recentes</h3><div class="list">'+rec.slice(0,6).map(x=>card(x[0],x[1])).join('')+'</div></div>');
 }
 bn.querySelector('[data-m=home]').classList.toggle('on',ws&&!favMode);
 bn.querySelector('[data-m=favs]').classList.toggle('on',favMode&&ws);
 if(!same&&!RM)m.querySelectorAll('.mhome>*,.mbar').forEach((el,i)=>el.animate([{opacity:0,transform:'translateY(14px)'},{opacity:1,transform:'none'}],{duration:450,delay:i*60,easing:'cubic-bezier(.16,1,.3,1)',fill:'backwards'}));
};
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-m]');if(!t)return;
 const a=t.dataset.m,first=route||(S.boxes[0]&&S.boxes[0].id);
 if(a==='home'||a==='favs'){closeSt();route=null;q='';$('#q').value='';filt='all';tagf=null;favMode=a==='favs';render();scrollTo(0,0)}
 else if(a==='search'){closeSt();$('#q2').focus();scrollTo({top:0,behavior:'smooth'})}
 else if(a==='box')boxForm();
 else if(a==='link'||a==='photo'){if(!first){toast('Crie uma caixa primeiro');boxForm()}else itemForm(first,{type:a})}
});
applyP();
boot();
</script>
</body>
